description: A dry, homestyle sabzi of cauliflower florets and potato cubes cooked in their own steam with onion, tomato and
  everyday masalas, finished with a squeeze of tang from amchur. Goes with roti, paratha or dal-chawal.
descriptions:
  hi: गोभी के फूल और आलू के टुकड़ों की सूखी, घर जैसी सब्ज़ी। इसे प्याज़, टमाटर और रोज़ के मसालों के साथ अपनी ही भाप में पकाया
    जाता है और आख़िर में अमचूर की हल्की खटास डाली जाती है। रोटी, पराठे या दाल-चावल के साथ खाएँ।
  hi-Latn: Gobi ke phool aur aloo ke tukdon ki sookhi, ghar jaisi sabzi. Ise pyaaz, tamatar aur roz ke masalon ke saath apni
    hi bhaap mein pakaya jaata hai aur aakhir mein amchur ki halki khatas daali jaati hai. Roti, parathe ya dal-chawal ke
    saath khaayein.
