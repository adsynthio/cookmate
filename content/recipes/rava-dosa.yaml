      safety: Garam tawe ki satah se haath door rakhiye.
- text: Stir the batter from the bottom, then pour a ladleful from a little height in a circle, starting at the edge and moving
    inward. Do not spread it. Lightly fill any very big gaps.
  technique: tawa_cook
  heat: medium
  cues:
