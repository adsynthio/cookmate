    के किसी भी दिन के खाने के लिए पूरा एक-बर्तन भोजन।
  hi-Latn: Khatti-meethi, halki masaledar Gujarati toor dal, jismein masale wale gehun ke aate ki naram dhokli usi mein pakayi
    jaati hai. Hafte ke kisi bhi din ke khaane ke liye poora ek-bartan bhojan.
