slug: moth-dal
title: Rajasthani Moth Dal
titles:
  hi: राजस्थानी मोठ दाल
  hi-Latn: Rajasthani Moth Dal
description: Whole moth beans soaked, pressure-cooked until soft, then simmered in a ghee tadka of cumin, garlic, onion and
  tomato. A thick, earthy everyday dal for bajra roti or rice.
descriptions:
  hi: साबुत मोठ को भिगोकर कुकर में नरम पकाया जाता है, फिर घी में जीरा, लहसुन, प्याज़ और टमाटर के तड़के में उबाला जाता है।
    बाजरे की रोटी या चावल के साथ खाने वाली गाढ़ी, रोज़ की दाल।
  hi-Latn: Saabut moth ko bhigokar cooker mein naram pakaya jaata hai, phir ghee mein jeera, lehsun, pyaaz aur tamatar ke
    tadke mein ubala jaata hai. Bajre ki roti ya chawal ke saath khaane wali gaadhi, roz ki dal.
