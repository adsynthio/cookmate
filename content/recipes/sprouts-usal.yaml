steps:
- text: Rinse the moong sprouts in a strainer under running water and let them drain.
  say:
    hi:
      text: मूंग स्प्राउट्स को छलनी में डालकर बहते पानी में धो लें और पानी निथरने दें।
    hi-Latn:
      text: Moong sprouts ko chhalni mein daal kar behte paani mein dho lein aur paani nitharne dein.
- text: Heat oil in a kadai, add mustard seeds, then cumin seeds, curry leaves and asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The mustard seeds crackle and pop.
  safety: Curry leaves splutter in hot oil, so stand back.
  say:
    hi:
      text: कढ़ाई में तेल गरम करें, राई डालें, फिर जीरा, करी पत्ता और हींग डालें।
      sound: राई चटकने लगती है।
      safety: गरम तेल में करी पत्ता छिटकता है, थोड़ा पीछे रहें।
    hi-Latn:
      text: Kadai mein tel garam karein, rai daalein, phir jeera, kadi patta aur hing daalein.
      sound: Rai chatakne lagti hai.
      safety: Garam tel mein kadi patta chhitakta hai, thoda peeche rahein.
- text: Add the onion, garlic and green chilli and sauté until the onion turns light golden.
  technique: saute_onion
  minutes: 4
  timer: true
  heat: medium
  cues:
    look: The onion turns soft and light golden.
    smell: The raw garlic smell goes away.
  say:
    hi:
      text: प्याज़, लहसुन और हरी मिर्च डालें और प्याज़ हल्का सुनहरा होने तक भूनें।
      look: प्याज़ नरम और हल्का सुनहरा हो जाता है।
      smell: लहसुन की कच्ची महक चली जाती है।
    hi-Latn:
      text: Pyaaz, lehsun aur hari mirch daalein aur pyaaz halka sunehra hone tak bhunein.
      look: Pyaaz naram aur halka sunehra ho jaata hai.
      smell: Lehsun ki kachchi mehak chali jaati hai.
- text: Add the tomato, turmeric, red chilli powder and coriander powder, then cook until the tomato is mushy.
  technique: bhuna
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The tomato breaks down and oil shows at the edges.
  say:
    hi:
      text: टमाटर, हल्दी, लाल मिर्च पाउडर और धनिया पाउडर डालें और टमाटर गलने तक पकाएँ।
      look: टमाटर गल जाता है और किनारों पर तेल दिखने लगता है।
    hi-Latn:
      text: Tamatar, haldi, laal mirch powder aur dhaniya powder daalein aur tamatar galne tak pakayein.
      look: Tamatar gal jaata hai aur kinaron par tel dikhne lagta hai.
- text: Add the sprouts, salt and 1 cup of water, then stir, cover and simmer until the sprouts are tender.
  technique: simmer
  minutes: 12
  timer: true
  heat: low
  cues:
    touch: A sprout presses soft between your fingers but still holds its shape.
  say:
    hi:
      text: स्प्राउट्स, नमक और 1 कप पानी डालें, फिर चलाएँ, ढककर स्प्राउट्स नरम होने तक धीमी आँच पर पकाएँ।
      touch: उँगलियों से दबाने पर स्प्राउट नरम लगता है पर आकार बना रहता है।
    hi-Latn:
      text: Sprouts, namak aur 1 cup paani daalein, phir chalayein, dhak kar sprouts naram hone tak dheemi aanch par pakayein.
      touch: Ungliyon se dabane par sprout naram lagta hai par shape bani rehti hai.
- text: Stir in the grated coconut, garam masala and jaggery, then simmer until the gravy thickens a little.
  technique: simmer
  minutes: 3
  timer: true
  heat: low
  cues:
    look: The gravy coats the sprouts loosely.
  say:
    hi:
      text: कद्दूकस किया नारियल, गरम मसाला और गुड़ मिलाएँ, फिर ग्रेवी थोड़ी गाढ़ी होने तक पकाएँ।
      look: ग्रेवी स्प्राउट्स पर हल्की-सी लिपटी दिखती है।
    hi-Latn:
      text: Kaddukas kiya nariyal, garam masala aur gud milayein, phir gravy thodi gaadhi hone tak pakayein.
      look: Gravy sprouts par halki-si lipti dikhti hai.
- text: Turn off the heat, squeeze in the lemon, sprinkle coriander leaves and serve hot.
  say:
    hi:
      text: आँच बंद करें, नींबू निचोड़ें, हरा धनिया डालें और गरम परोसें।
    hi-Latn:
      text: Aanch band karein, nimbu nichodein, hara dhaniya daalein aur garam parosein.
