      smell: Adrak lahsun ki kachchi mehak chali jaaye.
- text: Remove the bay leaf, let the mixture cool a little and grind it to a very smooth paste with a splash of water.
  cues:
    look: The paste is silky with no cashew bits.
  safety: Let it cool before grinding; hot mixture can push the mixer lid open.
  say:
    hi:
      text: तेज पत्ता निकालकर मिश्रण थोड़ा ठंडा करता हूँ और थोड़ा पानी डालकर एकदम चिकना पीस लेता हूँ।
      look: पेस्ट मुलायम हो, काजू के टुकड़े न दिखें।
      safety: पीसने से पहले ठंडा करें; गरम मिश्रण से मिक्सर का ढक्कन खुल सकता है।
