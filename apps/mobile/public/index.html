<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale stops iPhone zooming into a text field on focus; pinch-zoom still works on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installable web app: on iPhone, Share > Add to Home Screen opens it full screen like an app. -->
    <link rel="manifest" href="__BASE__/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="__BASE__/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="__BASE__/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cookmate" />
    <!-- black-translucent: the app draws under the status bar, edge to edge like a native app. Every screen already
         pads itself with the safe-area insets (Screen, HomeHero, TabBar), which iOS reports through env(). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <style id="expo-reset">
      html, body { height: 100%; background: #FDF9F2; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      @media (prefers-color-scheme: dark) { html, body { background: #15140F; } }
      /* U10: a branded first moment while the app's code loads (a second or two on a phone), instead of a blank
         screen. Plain HTML and CSS in #root; React replaces it as soon as the app starts. */
      #boot { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 6px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #56652B; }
      #boot .bowl { font-size: 56px; line-height: 1.2; animation: boot-bob 1.4s ease-in-out infinite; }
      #boot .name { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
      #boot .tag { font-size: 14px; color: #7A6F5E; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { #boot .bowl { animation: none; } }
      @media (prefers-color-scheme: dark) { #boot { color: #C9D69A; } #boot .tag { color: #A89F8E; } }
      /* iOS draws the clock and battery in white under black-translucent. The screens run under the notch / Dynamic
         Island like a native app; only where the white clock would sit on a light screen (light mode, except Home
         while its dark hero is up there) does an olive band fade in behind it. The root layout sets
         data-status-band. The band is as tall as the status bar and never takes taps. */
      #status-band { display: none; }
      @media (display-mode: standalone) {
        #status-band {
          display: block; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px);
          background: #56652B; z-index: 2147483647; pointer-events: none; opacity: 0; transition: opacity 180ms ease;
        }
        html[data-status-band="on"] #status-band { opacity: 1; }
        /* Feels like an app, not a page: no text selection or Copy/Save menus on long press, except in text fields
           and text the app marks selectable (the circle invite code). */
        body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
        img { -webkit-user-drag: none; }
      }
      /* iOS 26 home-screen apps: 100% (and dvh/svh) stop at the bottom of the status bar instead of the bottom of the
         screen, so the app ended one status bar short and the tab bar floated above an empty strip (WebKit bug
         301994). The installed app uses the full screen height instead: --app-height from the script below on
         iPhone, else 100vh, which iOS gets right with the black-translucent status bar. */
      @media (display-mode: standalone) {
        html, body, #root { height: var(--app-height, 100vh); }
      }
    </style>
  </head>
  <body>
    <noscript>Cookmate needs JavaScript to run.</noscript>
    <div id="root">
      <div id="boot" role="status" aria-label="Cookmate is starting">
        <div class="bowl" aria-hidden="true">🍲</div>
        <div class="name">Cookmate</div>
        <div class="tag">Made for Indian kitchens</div>
      </div>
    </div>
    <div id="status-band" aria-hidden="true"></div>
    <script>
      // Installed on an iPhone: the app fills the whole screen, so its height is the screen's height (in CSS pixels).
      (function () {
        var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
        if (!standalone || !/iPhone|iPod/.test(navigator.userAgent)) return;
        function fit() {
          var portrait = matchMedia("(orientation: portrait)").matches;
          var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          document.documentElement.style.setProperty("--app-height", Math.max(window.innerHeight, full) + "px");
        }
        fit();
        addEventListener("resize", fit);
        addEventListener("orientationchange", fit);
      })();
    </script>
    <script>
      // Offline support for the installed web app (public/sw.js). Skipped on localhost so development stays fresh.
      if ("serviceWorker" in navigator && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("__BASE__/sw.js", { scope: "__BASE__/" }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
