steps:
- text: Finely chop the onion, tomato, green chilli and coriander, grate the carrot if using, and mix them in a bowl with
    a pinch of the salt.
  minutes: 10
  timer: true
  say:
    hi:
      text: प्याज़, टमाटर, हरी मिर्च और हरा धनिया बारीक काट लो। गाजर डाल रहे हो तो उसे कद्दूकस कर लो। सबको एक कटोरे में थोड़े
        से नमक के साथ मिला लो।
    hi-Latn:
      text: Pyaaz, tamatar, hari mirch aur hara dhaniya baareek kaat lo. Gajar daal rahe ho to use kaddukas kar lo. Sabko
        ek katore mein thode se namak ke saath mila lo.
- text: Stir the batter well, and add the rest of the salt only if your batter is unsalted.
  cues:
    look: The batter is thick but pours slowly from the ladle.
    smell: It smells pleasantly sour.
  say:
    hi:
      text: बैटर को अच्छे से चला लो। अगर बैटर में नमक नहीं है, तभी बाकी नमक डालना।
      look: बैटर गाढ़ा हो, पर करछी से धीरे-धीरे गिरे।
      smell: हल्की खट्टी, अच्छी खुशबू आए।
    hi-Latn:
      text: Batter ko achhe se chala lo. Agar batter mein namak nahi hai, tabhi baaki namak daalna.
      look: Batter gaadha ho, par karchhi se dheere-dheere gire.
      smell: Halki khatti, achhi khushboo aaye.
- text: Heat the tawa on medium and grease it lightly with a few drops of oil.
  technique: tawa_cook
  minutes: 3
  timer: true
  heat: medium
  cues:
    look: The oil shimmers on the tawa.
    touch: Your palm held above the tawa feels clear heat.
  say:
    hi:
      text: तवा मध्यम आँच पर गरम करो और कुछ बूँद तेल से हल्का चिकना कर लो।
      look: तवे पर तेल चमकने लगे।
      touch: तवे के ऊपर हथेली रखो तो साफ़ गरमी महसूस हो।
    hi-Latn:
      text: Tawa medium aanch par garam karo aur kuch boond tel se halka chikna kar lo.
      look: Tawe par tel chamakne lage.
      touch: Tawe ke upar hatheli rakho to saaf garmi mehsoos ho.
- text: Pour one ladle of batter in the centre and spread it gently into a thick round about the size of a small plate.
  technique: tawa_cook
  heat: medium
  cues:
    look: The round stays thick, not thin like a dosa.
    sound: The batter gives a soft sizzle as it touches the tawa.
  say:
    hi:
      text: बीच में एक करछी बैटर डालो और हल्के से फैलाकर छोटी प्लेट जितना मोटा गोल बना लो।
      look: उत्तपम मोटा ही रहे, डोसे जैसा पतला नहीं।
      sound: बैटर तवे पर पड़ते ही हल्का छन्न करे।
    hi-Latn:
      text: Beech mein ek karchhi batter daalo aur halke se phailakar chhoti plate jitna mota gol bana lo.
      look: Uttapam mota hi rahe, dose jaisa patla nahi.
      sound: Batter tawe par padte hi halka chhann kare.
- text: Scatter a handful of the vegetable mix on top and press it lightly into the batter with the back of the ladle.
  heat: medium
  say:
    hi:
      text: ऊपर से एक मुट्ठी सब्ज़ी का मिश्रण फैलाओ और करछी के पिछले हिस्से से हल्का दबा दो।
    hi-Latn:
      text: Upar se ek mutthi sabzi ka mishran phailao aur karchhi ke pichhle hisse se halka daba do.
- text: Drizzle a teaspoon of oil around the edge, cover and cook until the base is golden.
  technique: tawa_cook
  minutes: 3
  timer: true
  heat: medium
  cues:
    look: The top is no longer wet and the edges turn golden and lift.
    smell: It smells toasty.
  say:
    hi:
      text: किनारों पर एक छोटा चम्मच तेल डालो, ढककर नीचे से सुनहरा होने तक सेंको।
      look: ऊपर का हिस्सा गीला न रहे और किनारे सुनहरे होकर उठने लगें।
      smell: सिंकने की अच्छी खुशबू आए।
    hi-Latn:
      text: Kinaron par ek chhota chammach tel daalo, dhakkar neeche se sunehra hone tak senko.
