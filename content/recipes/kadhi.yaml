      look: पूरी सतह पर बुलबुले उठने लगें।
      safety: उबाल आने तक चलाते रहें, वरना कढ़ी फट जाएगी।
    hi-Latn:
      text: Kaddukas kiya adrak aur chiri hui hari mirch daalein, kadai ko medium aanch par rakhein aur ubaal aane tak lagataar
