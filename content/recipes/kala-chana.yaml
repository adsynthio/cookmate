  say:
    hi:
      text: कढ़ाई में सरसों का तेल हल्का धुआँ आने तक गरम करो, जीरा और तेज पत्ता डालो, फिर प्याज़ डालकर सुनहरा भूरा होने तक
        भूनो।
      look: प्याज़ एक जैसा सुनहरा भूरा हो जाता है।
      sound: तेल में डालते ही जीरा चटकने लगता है।
