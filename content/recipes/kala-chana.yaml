steps:
- text: Wash the black chickpeas and soak them in plenty of water for 8 hours or overnight, then drain and rinse.
  technique: soak
  minutes: 480
  timer: true
  cues:
    look: The chana swell to almost double their size.
  say:
    hi:
      text: काले चने धोकर भरपूर पानी में 8 घंटे या रात भर भिगो दो, फिर पानी निकालकर एक बार धो लो।
      look: चने फूलकर लगभग दुगने हो जाते हैं।
    hi-Latn:
      text: Kale chane dhokar bharpoor paani mein 8 ghante ya raat bhar bhigo do, phir paani nikaal kar ek baar dho lo.
      look: Chane phoolkar lagbhag dugne ho jaate hain.
- text: Pressure-cook the chana with 600 ml water, half the salt and the turmeric for 6 to 7 whistles on medium heat, then
    let the pressure drop on its own.
  technique: pressure_cook
  minutes: 30
  whistles: 7
  timer: true
  heat: medium
  cues:
    touch: A chana presses flat easily between two fingers.
  safety: Open the cooker only after all the pressure has released.
  say:
    hi:
      text: चनों को 600 ml पानी, आधा नमक और हल्दी के साथ कुकर में मध्यम आँच पर 6 से 7 सीटी तक पकाओ, फिर प्रेशर अपने आप उतरने
        दो।
      touch: एक चना दो उंगलियों के बीच आसानी से दब जाता है।
      safety: सारा प्रेशर निकल जाने के बाद ही कुकर खोलो।
    hi-Latn:
      text: Chanon ko 600 ml paani, aadha namak aur haldi ke saath cooker mein medium aanch par 6 se 7 seeti tak pakao, phir
        pressure apne aap utarne do.
      touch: Ek chana do ungliyon ke beech aasaani se dab jaata hai.
      safety: Saara pressure nikal jaane ke baad hi cooker kholo.
- text: Heat mustard oil in a kadai until it smokes lightly, add cumin seeds and bay leaf, then the onion, and fry until golden
    brown.
  technique: saute_onion
  minutes: 8
  timer: true
  heat: medium
  cues:
