  technique: bhuna
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The tomato is mushy and oil shows at the sides.
  say:
    hi:
      text: टमाटर, नमक, हल्दी, लाल मिर्च और धनिया पाउडर डालो, और तब तक पकाओ जब तक टमाटर गल न जाए और किनारों पर तेल न दिखे।
