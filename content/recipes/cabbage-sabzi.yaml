steps:
- text: Wash the cabbage, shred it finely and let it drain in a colander; chop the tomato, ginger and green chillies.
  say:
    hi:
      text: पत्ता गोभी धोकर बारीक काटें और छलनी में पानी निकलने दें; टमाटर, अदरक और हरी मिर्च काट लें।
    hi-Latn:
      text: Patta gobhi dhokar baarik kaatein aur chhalni mein paani nikalne dein; tamatar, adrak aur hari mirch kaat lein.
- text: Heat the oil in a kadai on medium heat and add the cumin seeds.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The cumin crackles and sizzles.
  say:
    hi:
      text: कढ़ाई में मध्यम आंच पर तेल गरम करें और जीरा डालें।
      sound: जीरा चटकने और चड़चड़ाने लगे।
    hi-Latn:
      text: Kadai mein medium aanch par tel garam karein aur jeera daalein.
      sound: Jeera chatakne aur chadchadane lage.
- text: Add the ginger and green chillies and sauté for 30 seconds.
  minutes: 1
  heat: medium
  cues:
    smell: The raw smell of ginger goes away.
  say:
    hi:
      text: अदरक और हरी मिर्च डालकर 30 सेकंड भूनें।
      smell: अदरक की कच्ची महक चली जाए।
    hi-Latn:
      text: Adrak aur hari mirch daalkar 30 second bhoonein.
      smell: Adrak ki kachchi mahak chali jaaye.
- text: Add the tomato, turmeric, red chilli powder, coriander powder and salt, and cook until the tomato turns soft.
  technique: bhuna
  minutes: 3
  timer: true
  heat: medium
  cues:
    look: The tomato turns mushy and the oil starts to show at the edges.
  say:
    hi:
      text: टमाटर, हल्दी, लाल मिर्च, धनिया पाउडर और नमक डालें और टमाटर नरम होने तक पकाएं।
      look: टमाटर गल जाए और किनारों से तेल दिखने लगे।
    hi-Latn:
      text: Tamatar, haldi, lal mirch, dhania powder aur namak daalein aur tamatar naram hone tak pakaayein.
      look: Tamatar gal jaaye aur kinaaron se tel dikhne lage.
- text: Add the cabbage and peas, mix well, cover and cook on low heat without adding water, stirring every few minutes.
  minutes: 12
  timer: true
  heat: low
  cues:
    look: The cabbage wilts and turns glossy.
    touch: The cabbage is tender but still has a slight bite.
  say:
    hi:
      text: पत्ता गोभी और मटर डालें, अच्छे से मिलाएं, ढककर धीमी आंच पर बिना पानी डाले पकाएं और बीच-बीच में चलाते रहें।
      look: गोभी सिकुड़ जाए और चमकदार दिखने लगे।
      touch: गोभी नरम हो जाए पर थोड़ी कुरकुरी रहे।
    hi-Latn:
      text: Patta gobhi aur matar daalein, achche se milaayein, dhakkar dheemi aanch par bina paani daale pakaayein aur beech-beech
        mein chalaate rahein.
      look: Gobhi sikud jaaye aur chamakdaar dikhne lage.
      touch: Gobhi naram ho jaaye par thodi kurkuri rahe.
- text: Uncover, raise the heat to medium and stir-fry until the extra moisture dries up, then sprinkle in the garam masala.
  minutes: 3
  timer: true
  heat: medium
  cues:
    look: No water is left at the bottom of the kadai.
  say:
    hi:
      text: ढक्कन हटाएं, आंच मध्यम करें और पानी सूखने तक भूनें, फिर गरम मसाला छिड़कें।
      look: कढ़ाई के तले में पानी न बचे।
    hi-Latn:
      text: Dhakkan hataayein, aanch medium karein aur paani sookhne tak bhoonein, phir garam masala chhidkein.
      look: Kadai ke tale mein paani na bache.
- text: Turn off the heat, garnish with chopped coriander leaves and serve hot with roti.
