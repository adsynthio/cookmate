name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (schema + RLS tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated schema is up to date with docs/architecture
        run: python3 tools/archgen/build.py --check
      - name: Content is valid and seed.sql is up to date
        run: |
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 -m unittest discover -s tools/content
          python3 tools/content/build.py --check
      - name: Generated media map is up to date with assets/media
        run: python3 tools/media/sync.py --check
      - name: Install Postgres 16 with pgvector and pgTAP
        # The runner already has PostgreSQL 16. Take the two extensions from the PostgreSQL project's own apt
        # repository (PGDG), reading only that repository's index, so an outage of Ubuntu's mirrors can't fail the
        # job. If PGDG can't be used, fall back to Ubuntu's packages.
        run: |
          set -x
          from_pgdg() {
            key=/usr/share/keyrings/pgdg.asc
            sudo curl -fsSL --retry 3 -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get -o Acquire::Retries=3 update -q \
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends \
              postgresql-16 postgresql-16-pgvector postgresql-16-pgtap
          }
          from_ubuntu() {
            sudo rm -f /etc/apt/sources.list.d/pgdg.list
            sudo apt-get -o Acquire::Retries=3 update -q
            sudo apt-get -o Acquire::Retries=3 install -y -q postgresql-16 postgresql-16-pgvector postgresql-16-pgtap
          }
          from_pgdg || from_ubuntu
          ls /usr/share/postgresql/16/extension/ | grep -E '^(vector|pgtap)\.control$'
      - name: Apply migrations and run pgTAP tests
        run: sudo -E bash scripts/db/test-local.sh

  mobile:
    name: Mobile (typecheck + unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: No service keys in the app
        run: "! grep -rEn 'service_role|SERVICE_ROLE|sk-ant-' src app.json"

  functions:
    name: Edge Functions (shared code in sync, deno check + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shared parser copy matches the app's source
        run: python3 scripts/sync-shared.py --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-read --allow-write --allow-run=python3 supabase/functions/

  voice-agent:
    name: Voice agent (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
