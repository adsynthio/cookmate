      text: दाल को कढ़ाई में डालकर मिलाएँ। धीमी आँच पर 5 मिनट उबालें, बीच-बीच में चलाते रहें।
      look: तड़का अच्छे से मिल जाए और दाल धीरे-धीरे उबले।
