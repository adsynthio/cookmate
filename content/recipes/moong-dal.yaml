steps:
- text: Wash the moong dal in water 2 to 3 times and soak it in fresh water for 15 minutes, then drain.
  technique: soak
  minutes: 15
  timer: true
  cues:
    look: The washing water runs almost clear.
  say:
    hi:
      text: मूंग दाल को 2 से 3 बार पानी से धोकर 15 मिनट के लिए ताज़े पानी में भिगो दें, फिर पानी निकाल दें।
      look: धोने का पानी लगभग साफ़ दिखने लगे।
    hi-Latn:
      text: Moong dal ko 2 se 3 baar paani se dhokar 15 minute ke liye taaze paani mein bhigo dein, phir paani nikaal dein.
      look: Dhone ka paani lagbhag saaf dikhne lage.
- text: Put the dal in the pressure cooker with 800 ml water, the turmeric and salt, and cook on medium heat for 3 whistles.
  technique: pressure_cook
  minutes: 12
  whistles: 3
  timer: true
  heat: medium
  safety: Let the pressure drop on its own before opening the lid.
  say:
    hi:
      text: दाल को प्रेशर कुकर में 800 ml पानी, हल्दी और नमक के साथ डालें और मध्यम आँच पर 3 सीटी तक पकाएँ।
      safety: ढक्कन खोलने से पहले प्रेशर अपने आप निकलने दें।
    hi-Latn:
      text: Dal ko pressure cooker mein 800 ml paani, haldi aur namak ke saath daalein aur medium aanch par 3 seeti tak pakaayein.
      safety: Dhakkan kholne se pehle pressure apne aap nikalne dein.
- text: Open the cooker and whisk the dal with a ladle until smooth.
  cues:
    look: The grains have broken down into a creamy dal.
  say:
    hi:
      text: कुकर खोलें और करछी से दाल को अच्छी तरह घोटकर एकसार कर लें।
      look: दाने टूटकर दाल मलाईदार हो जाए।
    hi-Latn:
      text: Cooker kholein aur karchhi se dal ko achhi tarah ghotkar eksaar kar lein.
      look: Daane tootkar dal malaidaar ho jaaye.
- text: Heat ghee in a kadai, add cumin seeds and asafoetida, then the chopped garlic and ginger, and stir for a minute.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    look: The garlic turns light golden.
    sound: The cumin crackles in the ghee.
  say:
    hi:
      text: कढ़ाई में घी गरम करें, जीरा और हींग डालें, फिर कटा लहसुन और अदरक डालकर एक मिनट चलाएँ।
      look: लहसुन हल्का सुनहरा हो जाए।
      sound: जीरा घी में चटकने लगे।
    hi-Latn:
      text: Kadai mein ghee garam karein, jeera aur hing daalein, phir kata lehsun aur adrak daalkar ek minute chalaayein.
