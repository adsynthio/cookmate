      look: Poori satah par bulbule uthne lagein.
      safety: Ubaal aane tak chalate rahein, warna kadhi phat jayegi.
- text: Lower the heat and simmer, stirring now and then, until the kadhi thickens and the raw gram flour smell is gone.
  technique: simmer
  minutes: 15
  timer: true
  heat: low
  cues:
    look: It lightly coats the back of the ladle.
    sound: It bubbles gently.
