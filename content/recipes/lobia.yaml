steps:
- text: Rinse the lobia and soak it in plenty of water for 6 to 8 hours, then drain and rinse again.
  technique: soak
  minutes: 360
  timer: true
  cues:
    look: The beans swell to about double their size.
  say:
    hi:
      text: लोबिया धोकर भरपूर पानी में 6 से 8 घंटे भिगो दें, फिर पानी निकालकर दोबारा धो लें।
      look: दाने फूलकर लगभग दोगुने हो जाते हैं।
    hi-Latn:
      text: Lobia dhokar bharpoor paani mein 6 se 8 ghante bhigo dein, phir paani nikaalkar dobara dho lein.
      look: Daane phoolkar lagbhag dugne ho jaate hain.
- text: Put the lobia in the pressure cooker with about 3 cups fresh water, half the salt and the turmeric, and cook on medium
    heat for 4 whistles; let the pressure drop on its own.
  technique: pressure_cook
  minutes: 15
  whistles: 4
  timer: true
  heat: medium
  cues:
    touch: A bean mashes easily between your fingers.
  say:
    hi:
      text: लोबिया को कुकर में लगभग 3 कप ताज़ा पानी, आधा नमक और हल्दी के साथ डालें और मध्यम आँच पर 4 सीटी लगाएँ; प्रेशर अपने
        आप उतरने दें।
      touch: एक दाना उँगलियों में आसानी से मसल जाता है।
