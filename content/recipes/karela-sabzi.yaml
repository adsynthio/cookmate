steps:
- text: Lightly scrape the bitter gourds and cut them into thin rounds. Rub them with most of the salt and half the turmeric,
    then leave them for 20 minutes.
  minutes: 20
  timer: true
  cues:
    look: Water beads appear on the slices.
  say:
    hi:
      text: करेले हल्के से छील लें और पतले गोल टुकड़ों में काट लें। इनमें ज़्यादातर नमक और आधी हल्दी मलें, फिर 20 मिनट छोड़
        दें।
      look: टुकड़ों पर पानी की बूँदें दिखने लगती हैं।
    hi-Latn:
      text: Karele halke se chheel lein aur patle gol tukdon mein kaat lein. Inme zyaadatar namak aur aadhi haldi malein,
        phir 20 minute chhod dein.
      look: Tukdon par paani ki boondein dikhne lagti hain.
- text: Squeeze the slices firmly by the handful and throw away the bitter water.
  cues:
    touch: The slices feel limp and fairly dry.
  say:
    hi:
      text: मुट्ठी भर-भर के टुकड़ों को कस के निचोड़ें और कड़वा पानी फेंक दें।
      touch: टुकड़े नरम और काफ़ी सूखे लगते हैं।
    hi-Latn:
      text: Mutthi bhar-bhar ke tukdon ko kas ke nichodein aur kadwa paani phenk dein.
      touch: Tukde naram aur kaafi sookhe lagte hain.
- text: Heat the oil in a kadai on medium heat. Add the cumin seeds and asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The cumin crackles.
  say:
    hi:
      text: कढ़ाई में मध्यम आँच पर तेल गरम करें। उसमें जीरा और हींग डालें।
      sound: जीरा चटकने लगता है।
    hi-Latn:
      text: Kadai mein medium aanch par tel garam karein. Usme jeera aur hing daalein.
      sound: Jeera chatakne lagta hai.
- text: Add the squeezed bitter gourd and fry it uncovered, stirring now and then.
  technique: shallow_fry
  minutes: 12
  timer: true
  heat: medium
  cues:
    look: The slices shrink and the edges turn brown.
  say:
    hi:
      text: निचोड़ा हुआ करेला डालें और बिना ढके भूनें, बीच-बीच में चलाते रहें।
      look: टुकड़े सिकुड़ जाते हैं और किनारे भूरे हो जाते हैं।
    hi-Latn:
      text: Nichoda hua karela daalein aur bina dhake bhunein, beech-beech mein chalate rahein.
      look: Tukde sikud jaate hain aur kinare bhoore ho jaate hain.
- text: Add the sliced onions and cook them with the bitter gourd.
  technique: saute_onion
  minutes: 7
  timer: true
