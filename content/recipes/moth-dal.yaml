      look: मसाले के किनारों पर घी अलग दिखने लगता है।
      touch: टमाटर कलछी से दबाने पर मसल जाता है।
    hi-Latn:
      text: Kata tamatar, laal mirch powder aur dhaniya powder daalein aur tamatar galne tak, masala kinaaron par ghee chhodne
        tak bhunein.
      look: Masale ke kinaaron par ghee alag dikhne lagta hai.
      touch: Tamatar kalchhi se dabaane par masal jaata hai.
- text: Pour in the cooked moth with its water, lightly mash a few beans with the ladle and simmer, adding a little hot water
