      look: Mixture ek jaisa peela aur upar se thoda jhaagdaar dikhe.
- text: Divide the dough into 4 balls and roll each one into a round about 7 inches wide, dusting with a little flour.
  technique: shape
  say:
    hi:
      text: आटे की 4 लोइयां बनाएं और थोड़ा सूखा आटा लगाकर हर लोई को लगभग 7 इंच का गोल बेल लें।
    hi-Latn:
      text: Aate ki 4 loiyan banayein aur thoda sookha atta lagakar har loi ko lagbhag 7 inch ka gol bel lein.
- text: Cook one rolled paratha on a hot tawa on medium heat for about 1 minute on each side.
  technique: tawa_cook
  minutes: 2
  heat: medium
  cues:
    look: Light brown spots appear and the paratha starts to puff in places.
  say:
    hi:
      text: एक बेले हुए पराठे को गरम तवे पर मध्यम आंच पर हर तरफ लगभग 1 मिनट सेंकें।
      look: हल्के भूरे धब्बे दिखें और पराठा जगह-जगह से फूलने लगे।
    hi-Latn:
      text: Ek bele hue parathe ko garam tawe par medium aanch par har taraf lagbhag 1 minute senkein.
      look: Halke bhoore dhabbe dikhein aur paratha jagah-jagah se phoolne lage.
- text: Lift the paratha off, spread a little ghee on the tawa, pour a quarter of the stirred egg mixture and spread it into
