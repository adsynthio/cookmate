steps:
- text: Pick the methi leaves, wash them well in plenty of water and chop finely. Mix in a pinch of the salt, keep aside for
    10 minutes, then squeeze out the bitter water.
  minutes: 10
  timer: true
  cues:
    look: Water collects at the bottom when you squeeze the leaves.
  safety: Wash the leaves 2-3 times, because methi often holds mud.
  say:
    hi:
      text: मेथी की पत्तियाँ तोड़कर खूब पानी में अच्छे से धोइए और बारीक काट लीजिए। इसमें नमक में से एक चुटकी मिलाकर 10 मिनट
        रख दीजिए, फिर कड़वा पानी निचोड़कर निकाल दीजिए।
      look: पत्तियाँ निचोड़ने पर नीचे पानी इकट्ठा हो जाता है।
      safety: पत्तियों को 2-3 बार धोइए, क्योंकि मेथी में अक्सर मिट्टी रहती है।
    hi-Latn:
      text: Methi ki pattiyan todkar khoob paani mein achhe se dhoiye aur baareek kaat lijiye. Isme namak mein se ek chutki
        milakar 10 minute rakh dijiye, phir kadwa paani nichodkar nikaal dijiye.
      look: Pattiyan nichodne par neeche paani ikattha ho jaata hai.
      safety: Pattiyon ko 2-3 baar dhoiye, kyunki methi mein aksar mitti rehti hai.
- text: Peel the potatoes and cut them into small cubes. Finely chop the garlic and slit the green chillies.
  minutes: 5
  timer: true
  say:
    hi:
      text: आलू छीलकर छोटे टुकड़ों में काट लीजिए। लहसुन बारीक काटिए और हरी मिर्च बीच से चीर लीजिए।
    hi-Latn:
      text: Aloo chheelkar chhote tukdon mein kaat lijiye. Lehsun baareek kaatiye aur hari mirch beech se cheer lijiye.
- text: Heat the oil in a kadai on medium heat, add the cumin and let it crackle, then add the garlic and green chillies and
    fry until the garlic turns light golden.
  technique: tadka
  minutes: 2
  heat: medium
  cues:
