steps:
- text: In the kadai, whisk the gram flour, turmeric and salt into the buttermilk until no lumps remain.
  technique: batter
  minutes: 3
  timer: true
  cues:
    look: The mixture is an even pale yellow.
    touch: It feels smooth with no lumps between your fingers.
  say:
    hi:
      text: कढ़ाई में छाछ लें, उसमें बेसन, हल्दी और नमक डालकर तब तक फेंटें जब तक कोई गुठली न रहे।
      look: मिश्रण एक जैसा हल्का पीला दिखे।
      touch: उंगलियों में चिकना लगे, कोई गुठली न हो।
    hi-Latn:
      text: Kadai mein chhaach lein, usmein besan, haldi aur namak daalkar tab tak phentein jab tak koi gutthli na rahe.
      look: Mixture ek jaisa halka peela dikhe.
      touch: Ungliyon mein chikna lage, koi gutthli na ho.
- text: Add the grated ginger and slit green chillies, put the kadai on medium heat and stir non-stop until it comes to a
