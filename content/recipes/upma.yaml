      look: Dalein sunehri bhoori ho jayein.
      sound: Rai chatakne lage.
      safety: Garam tel me curry patte chatakte hain, daalte samay thoda peeche rahein.
- text: Add the onion and sauté till soft.
  technique: saute_onion
  minutes: 3
  timer: true
  heat: medium
  cues:
