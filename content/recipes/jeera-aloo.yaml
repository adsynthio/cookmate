slug: jeera-aloo
title: Jeera Aloo
titles: {hi: जीरा आलू, hi-Latn: Jeera Aloo}
description: >-
  Boiled potatoes tossed in a cumin tadka with turmeric, chilli and a squeeze of amchur. Quick, dry and loved by children.
descriptions:
  hi: "उबले आलू जीरे के तड़के में, हल्दी, मिर्च और थोड़े आमचूर के साथ। जल्दी बनते हैं, सूखे, और बच्चों को पसंद।"
  hi-Latn: "Ubale aloo jeere ke tadke mein, haldi, mirch aur thode amchur ke saath. Jaldi bante hain, sookhe, aur bachchon ko pasand."
cuisine_region: generic_north
course: side
diet: vegan
base_servings: 4
prep_time_min: 5
cook_time_min: 20
difficulty: 1
spice_level: 2
equipment: [pressure_cooker, kadai]
tags: [quick, kids_friendly]
flavor_profile: {rich: 0.3, heat: 0.3, acid: 0.3, crunch: 0.3, starch: 0.9, sweet: 0}
food_groups: [sabzi]
review_status: draft
ingredients:
  - {ingredient: potato, qty: 500, unit: g, local: 4 medium aloo, role: base}
  - {ingredient: refined oil, qty: 28, unit: ml, local: 2 chammach, role: fat}
  - {ingredient: cumin seeds, qty: 4, unit: g, local: 2 chhota chammach, role: spice}
  - {ingredient: asafoetida, qty: 0.2, unit: g, local: 1 chutki, role: aromatic}
  - {ingredient: green chilli, qty: 6, unit: g, local: 2 hari mirch, role: heat}
  - {ingredient: ginger, qty: 8, unit: g, local: 1 inch, role: aromatic, optional: true}
  - {ingredient: turmeric powder, qty: 1.5, unit: g, local: aadha chhota chammach, role: spice}
  - {ingredient: red chilli powder, qty: 1.25, unit: g, local: aadha chhota chammach, role: heat}
  - {ingredient: coriander powder, qty: 2, unit: g, local: 1 chhota chammach, role: spice}
  - {ingredient: dry mango powder, qty: 1.25, unit: g, local: aadha chhota chammach, role: acid, substitutes: [{ingredient: lemon, ratio: 1, note: juice of half a lemon at the end}]}
  - {ingredient: salt, qty: 6, unit: g, local: 1 chhota chammach, role: spice}
  - {ingredient: coriander leaves, qty: 10, unit: g, local: 1 mutthi, role: garnish}
steps:
  - text: Pressure-cook the whole potatoes with water to cover.
    technique: pressure_cook
    whistles: 2
    minutes: 10
    cue: Let the pressure drop by itself. A knife should slide in easily but the potato should still hold its shape.
    heat: medium
    cues:
      sound: "Count two whistles, then let the pressure drop by itself."
      touch: "A knife slides in easily but the potato still holds its shape."
    say:
      hi:
        text: "साबुत आलू को डूबने लायक पानी में कुकर में उबालें।"
        sound: "दो सीटी गिनें, फिर प्रेशर अपने आप उतरने दें।"
        touch: "चाकू आसानी से अंदर जाए पर आलू अपना आकार न छोड़े।"
      hi-Latn:
        text: "Saabut aloo ko doobne laayak paani mein cooker mein ubaalein."
        sound: "Do seeti ginein, phir pressure apne aap utarne dein."
        touch: "Chaaku aasaani se andar jaaye par aloo apna aakaar na chhode."
  - text: Peel the potatoes once cool enough to touch and cut into bite-sized cubes.
    minutes: 5
    cues:
      look: "Even, bite-sized cubes so they brown together."
      touch: "Cool enough to hold before peeling."
    say:
      hi:
        text: "आलू छूने लायक ठंडे हों तो छीलकर छोटे टुकड़ों में काटें।"
        look: "बराबर छोटे टुकड़े, ताकि सब एक साथ सिकें।"
        touch: "छीलने से पहले हाथ में पकड़ने लायक ठंडे हों।"
      hi-Latn:
        text: "Aloo chhoone laayak thande hon to chheel kar chhote tukdon mein kaatein."
        look: "Barabar chhote tukde, taaki sab ek saath sikein."
        touch: "Chheelne se pehle haath mein pakadne laayak thande hon."
  - text: Heat the oil in a kadai. Add cumin, then hing, green chilli and ginger and stir for 30 seconds.
    technique: tadka
    minutes: 1
    cue: Cumin sizzles and darkens one shade. If it turns black, start again.
    heat: medium
    cues:
      look: "Cumin darkens one shade."
      sound: "The cumin sizzles and crackles straight away."
      smell: "Toasty, nutty cumin."
      avoid: "If the cumin turns black, start again: it will taste bitter."
    say:
      hi:
        text: "कड़ाही में तेल गरम करें। जीरा डालें, फिर हींग, हरी मिर्च और अदरक डालकर 30 सेकंड चलाएँ।"
        look: "जीरा एक रंग गहरा हो जाए।"
        sound: "जीरा डालते ही चटकने लगे।"
        smell: "भुने जीरे की सोंधी ख़ुशबू।"
        avoid: "अगर जीरा काला हो जाए तो दोबारा शुरू करें: वरना कड़वा लगेगा।"
      hi-Latn:
        text: "Kadaahi mein tel garam karein. Jeera daalein, phir hing, hari mirch aur adrak daalkar 30 second chalaayein."
        look: "Jeera ek rang gehra ho jaaye."
        sound: "Jeera daalte hi chatakne lage."
        smell: "Bhune jeere ki sondhi khushboo."
        avoid: "Agar jeera kaala ho jaaye to dobaara shuru karein: warna kadva lagega."
  - text: Add turmeric, chilli powder and coriander powder, then immediately the potatoes and salt. Toss on medium heat.
    technique: shallow_fry
    minutes: 6
    timer: true
    cue: The edges of the potatoes turn golden and slightly crisp.
    heat: medium
    cues:
      look: "The edges turn golden and slightly crisp."
      sound: "A steady sizzle as you toss."
      avoid: "Toss gently so the potatoes don't break into mash."
    say:
      hi:
        text: "हल्दी, मिर्च पाउडर और धनिया पाउडर डालें, फिर तुरंत आलू और नमक डालें। मध्यम आँच पर उछालते हुए मिलाएँ।"
        look: "आलू के किनारे सुनहरे और थोड़े कुरकुरे हो जाएँ।"
        sound: "मिलाते समय लगातार छन-छन।"
        avoid: "हल्के हाथ से मिलाएँ ताकि आलू टूटकर भरता न बन जाएँ।"
      hi-Latn:
        text: "Haldi, mirch powder aur dhaniya powder daalein, phir turant aloo aur namak daalein. Madhyam aanch par uchhaalte hue milaayein."
        look: "Aloo ke kinaare sunehre aur thode kurkure ho jaayein."
        sound: "Milaate samay lagaataar chhan-chhan."
        avoid: "Halke haath se milaayein taaki aloo toot kar bharta na ban jaayein."
  - text: Sprinkle amchur and coriander leaves, toss once and serve.
    minutes: 1
    cues:
      taste: "Taste one piece for salt and sourness."
    say:
      hi:
        text: "आमचूर और हरा धनिया छिड़कें, एक बार मिलाएँ और परोसें।"
        taste: "एक टुकड़ा चखकर नमक और खटास देखें।"
      hi-Latn:
        text: "Amchur aur hara dhaniya chhidkein, ek baar milaayein aur parosein."
        taste: "Ek tukda chakh kar namak aur khataas dekhein."
variation_rules:
  - {type: equipment, condition: {missing_equipment: pressure_cooker}, action: {method: boil, minutes: 20, at_step: 1}, note: Boil in a covered pot for about 20 minutes until tender.}
  - {type: spice, condition: {member_age_group: child}, action: {omit: [green chilli, red chilli powder]}, note: Leave out the chillies; the cumin and amchur carry the flavour.}
