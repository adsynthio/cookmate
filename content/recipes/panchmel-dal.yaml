steps:
- text: Wash all five dals together in 3 to 4 changes of water, then soak them in fresh water for 30 minutes.
  technique: soak
  minutes: 30
  timer: true
  cues:
    look: The washing water runs almost clear.
  say:
    hi:
      text: पाँचों दालें एक साथ 3-4 पानी से धो लें, फिर ताज़े पानी में 30 मिनट भिगो दें।
      look: धोने का पानी लगभग साफ़ दिखने लगे।
    hi-Latn:
      text: Paanchon daalein ek saath 3-4 paani se dho lein, phir taaze paani mein 30 minute bhigo dein.
      look: Dhone ka paani lagbhag saaf dikhne lage.
- text: Drain the dals and put them in the pressure cooker with 800 ml water, the turmeric and the salt. Cook on medium heat
    for 4 whistles, then let the pressure drop on its own.
  technique: pressure_cook
  minutes: 15
  whistles: 4
  timer: true
  heat: medium
  safety: Open the cooker only after the pressure has fully dropped.
  say:
    hi:
      text: दालों का पानी निकालकर उन्हें कुकर में 800 मिली पानी, हल्दी और नमक के साथ डालें। मध्यम आँच पर 4 सीटी लगाएँ, फिर
        प्रेशर अपने आप उतरने दें।
      safety: प्रेशर पूरा उतरने के बाद ही कुकर खोलें।
    hi-Latn:
      text: Daalon ka paani nikaal kar unhein cooker mein 800 ml paani, haldi aur namak ke saath daalein. Medium aanch par
        4 seeti lagayein, phir pressure apne aap utarne dein.
      safety: Pressure poora utarne ke baad hi cooker kholein.
- text: Open the cooker and whisk the dal well with a ladle. Add up to 200 ml hot water for a medium-thick consistency.
  minutes: 2
  cues:
    look: The chana dal is soft and the dal looks creamy and well blended.
    touch: A chana dal grain mashes easily between your fingers.
  say:
    hi:
      text: कुकर खोलकर करछी से दाल अच्छी तरह घोट लें। मध्यम गाढ़ापन लाने के लिए ज़रूरत हो तो 200 मिली तक गरम पानी मिलाएँ।
      look: चना दाल नरम हो और दाल मलाईदार, एकसार दिखे।
      touch: चने का दाना उंगलियों में आसानी से मसल जाए।
    hi-Latn:
      text: Cooker khol kar karchhi se dal achhi tarah ghot lein. Medium gaadhapan laane ke liye zarurat ho to 200 ml tak
        garam paani milayein.
      look: Chana dal naram ho aur dal malaidaar, eksaar dikhe.
      touch: Chane ka daana ungliyon mein aasaani se masal jaaye.
- text: Heat the ghee in a kadai on medium heat. Add the cumin seeds, bay leaf, cloves, dry red chillies and asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    look: The cumin turns a shade darker.
    sound: The cumin crackles in the ghee.
    smell: Hing and cloves smell strongly fragrant.
  say:
    hi:
      text: कढ़ाई में मध्यम आँच पर घी गरम करें। जीरा, तेज पत्ता, लौंग, सूखी लाल मिर्च और हींग डालें।
      look: जीरा थोड़ा गहरा हो जाए।
      sound: जीरा घी में चटकने लगे।
      smell: हींग और लौंग की तेज़ खुशबू आए।
    hi-Latn:
      text: Kadhai mein medium aanch par ghee garam karein. Jeera, tej patta, laung, sookhi laal mirch aur hing daalein.
      look: Jeera thoda gehra ho jaaye.
      sound: Jeera ghee mein chatakne lage.
      smell: Hing aur laung ki tez khushboo aaye.
- text: Add the ginger, garlic and green chillies and sauté for 1 minute. Then add the tomato, red chilli powder and coriander
    powder and cook until the tomato is soft and the ghee separates.
  technique: bhuna
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The tomato turns mushy and ghee shows at the edges.
    smell: The raw garlic smell is gone.
  say:
    hi:
      text: अदरक, लहसुन और हरी मिर्च डालकर 1 मिनट भूनें। फिर टमाटर, लाल मिर्च पाउडर और धनिया पाउडर डालें। टमाटर गलने और घी
