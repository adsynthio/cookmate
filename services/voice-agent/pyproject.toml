[project]
name = "cookmate-voice-agent"
version = "0.1.0"
description = "Cookmate Voice Cook: LiveKit Agents worker (VAD -> Sarvam STT -> fast path | Claude -> Sarvam TTS)"
requires-python = ">=3.12"
dependencies = [
  "livekit-agents==1.8.11",
  "livekit-plugins-sarvam==1.8.11",
  "livekit-plugins-anthropic==1.8.11",
  "livekit-plugins-silero==1.8.11",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
