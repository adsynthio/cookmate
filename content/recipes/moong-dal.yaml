      sound: Jeera ghee mein chatakne lage.
- text: Add the chopped onion and green chilli and saute until the onion turns soft and golden.
  technique: saute_onion
  minutes: 4
  timer: true
  heat: medium
  cues:
    look: The onion is soft and golden at the edges.
  say:
