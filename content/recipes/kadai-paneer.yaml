steps:
- text: Dry roast the coriander seeds and dry red chillies in the kadai on low heat, then coarsely crush them in the mixer.
  technique: dry_roast
  minutes: 2
  heat: low
  cues:
    smell: The coriander smells toasty and fragrant.
  say:
    hi:
      text: कड़ाही में धीमी आँच पर साबुत धनिया और सूखी लाल मिर्च सूखा भूनें, फिर मिक्सर में दरदरा पीस लें।
      smell: धनिये से भुनी हुई खुशबू आने लगे।
    hi-Latn:
      text: Kadai mein dheemi aanch par sabut dhaniya aur sookhi laal mirch sookha bhunein, phir mixer mein dardara pees lein.
      smell: Dhaniye se bhuni hui khushboo aane lage.
- text: Cut the paneer, capsicum and one onion into bite-size cubes, finely chop the other onion, slit the green chillies
    and blend the tomatoes to a puree.
  say:
    hi:
      text: पनीर, शिमला मिर्च और एक प्याज़ के चौकोर टुकड़े काटें, दूसरा प्याज़ बारीक काटें, हरी मिर्च चीरें और टमाटर की प्यूरी
        बना लें।
    hi-Latn:
      text: Paneer, shimla mirch aur ek pyaaz ke chaukor tukde kaatein, doosra pyaaz baarik kaatein, hari mirch cheerein aur
        tamatar ki puree bana lein.
- text: Heat 1 tablespoon oil and toss the capsicum and onion cubes on high heat, then take them out.
  minutes: 2
  heat: high
  cues:
    look: The edges are lightly charred but the pieces are still crunchy.
  say:
    hi:
      text: 1 बड़ा चम्मच तेल गरम करके शिमला मिर्च और प्याज़ के टुकड़े तेज़ आँच पर उलटें-पलटें, फिर निकाल लें।
      look: किनारे हल्के जले हुए दिखें पर टुकड़े अब भी कुरकुरे हों।
    hi-Latn:
      text: 1 bada chammach tel garam karke shimla mirch aur pyaaz ke tukde tez aanch par ulte-palte, phir nikaal lein.
      look: Kinaare halke jale hue dikhein par tukde ab bhi kurkure hon.
- text: Add the remaining oil to the same kadai, add cumin seeds, then cook the chopped onion until golden on medium heat.
  technique: saute_onion
  minutes: 6
  timer: true
  heat: medium
  cues:
    look: The onion turns golden brown.
    sound: The cumin crackles as soon as it hits the oil.
  safety: Stand back, hot oil can splutter when the cumin goes in.
