steps:
- text: Pressure-cook the potatoes with a little water, then peel and mash them while warm.
  technique: pressure_cook
  whistles: 3
  heat: medium
  cues:
    touch: A knife goes through the potato easily.
  safety: Open the cooker only after the pressure drops on its own.
  say:
    hi:
      text: आलू को थोड़े पानी के साथ प्रेशर कुकर में पकाता हूँ, फिर छीलकर गरम-गरम मसल लेता हूँ।
      touch: चाकू आलू में आसानी से घुस जाए।
      safety: कुकर का प्रेशर अपने आप उतरने के बाद ही खोलें।
    hi-Latn:
      text: Aloo ko thode paani ke saath pressure cooker mein pakata hoon, phir chheel kar garam-garam masal leta hoon.
      touch: Chaaku aloo mein aasaani se ghus jaaye.
      safety: Cooker ka pressure apne aap utarne ke baad hi kholein.
- text: Grate the paneer into the mashed potato, add cornflour, garam masala and a little salt, knead to a smooth dough and
    shape 12 round balls.
  technique: shape
  cues:
    touch: The balls feel smooth with no cracks on the surface.
  say:
    hi:
      text: मसले आलू में पनीर कद्दूकस करता हूँ, कॉर्नफ्लोर, गरम मसाला और थोड़ा नमक डालकर चिकना गूंथता हूँ और 12 गोल कोफ्ते
        बनाता हूँ।
      touch: कोफ्ते चिकने लगें, ऊपर कोई दरार न हो।
    hi-Latn:
      text: Masle aloo mein paneer grate karta hoon, cornflour, garam masala aur thoda namak daal kar smooth goondhta hoon
        aur 12 gol kofte banata hoon.
      touch: Kofte smooth lagein, upar koi darar na ho.
- text: Heat oil in a kadai and deep-fry the koftas a few at a time, turning gently, until golden all over.
  technique: deep_fry
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: Koftas turn evenly golden brown.
  safety: Fry one kofta first to test; if it breaks, add a little more cornflour. Slide them in gently to avoid hot oil splashes.
  say:
    hi:
      text: कड़ाही में तेल गरम करके थोड़े-थोड़े कोफ्ते डालता हूँ और धीरे-धीरे पलटते हुए सुनहरा होने तक तलता हूँ।
      look: कोफ्ते चारों ओर से एक जैसे सुनहरे भूरे हो जाएँ।
      safety: पहले एक कोफ्ता तलकर देखें; टूटे तो थोड़ा और कॉर्नफ्लोर मिलाएँ। गरम तेल के छींटों से बचने के लिए कोफ्ते धीरे
        से डालें।
    hi-Latn:
      text: Kadai mein tel garam karke thode-thode kofte daalta hoon aur dheere-dheere palatte hue sunehra hone tak talta
        hoon.
      look: Kofte chaaron taraf se ek jaise sunehre brown ho jaayein.
      safety: Pehle ek kofta tal kar dekhein; toote to thoda aur cornflour milaayein. Garam tel ke chheenton se bachne ke
        liye kofte dheere se daalein.
- text: In another pan heat 1 tablespoon oil with the butter, add cumin and bay leaf, then add sliced onion and sauté until
    soft and light golden.
  technique: saute_onion
  minutes: 6
  timer: true
  heat: medium
  cues:
    look: Onions turn soft and light golden.
    sound: Cumin crackles as soon as it hits the fat.
  say:
    hi:
      text: दूसरे बर्तन में 1 बड़ा चम्मच तेल और मक्खन गरम करता हूँ, जीरा और तेज पत्ता डालता हूँ, फिर कटा प्याज़ डालकर नरम
        और हल्का सुनहरा होने तक भूनता हूँ।
      look: प्याज़ नरम और हल्का सुनहरा हो जाए।
      sound: जीरा डालते ही चटकने लगे।
    hi-Latn:
      text: Doosre bartan mein 1 bada chammach tel aur makhan garam karta hoon, jeera aur tej patta daalta hoon, phir kata
        pyaaz daal kar naram aur halka sunehra hone tak bhoonta hoon.
      look: Pyaaz naram aur halka sunehra ho jaaye.
      sound: Jeera daalte hi chatakne lage.
- text: Add ginger garlic paste, chopped tomato, cashews and green chilli, and cook until the tomatoes are completely mushy.
  technique: bhuna
  minutes: 8
  timer: true
  heat: medium
  cues:
    look: Tomatoes break down fully and oil shows at the edges.
    smell: The raw smell of ginger garlic goes away.
  say:
    hi:
      text: अदरक लहसुन पेस्ट, कटा टमाटर, काजू और हरी मिर्च डालकर टमाटर पूरी तरह गलने तक पकाता हूँ।
      look: टमाटर पूरी तरह गल जाएँ और किनारों पर तेल दिखे।
      smell: अदरक लहसुन की कच्ची महक चली जाए।
    hi-Latn:
      text: Adrak lahsun paste, kata tamatar, kaju aur hari mirch daal kar tamatar poori tarah galne tak pakata hoon.
