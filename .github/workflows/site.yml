name: Publish site and web app

# Publishes to GitHub Pages (https://adsynthio.github.io/cookmate/):
# - app/: the Cookmate web app, built from apps/mobile against the live Supabase project (the same public settings
#   as the phone builds in eas.json). On an iPhone, open it in Safari and Add to Home Screen (docs/IPHONE_WEB_APP.md).
# - the site/ pages (home, privacy policy, account deletion), which Google Play links to. They need two repository
#   variables (Settings > Secrets and variables > Actions > Variables): SUPPORT_EMAIL (the public contact address) and
#   OPERATOR (the name shown as who runs Cookmate). Without them the pages are left out, so a page with a placeholder
#   never goes live; the web app is published either way.
# Needs, once: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [site/**, apps/mobile/**, tools/web/**, .github/workflows/site.yml]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Build the web app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm ci
          # Same public settings as the phone builds: live mode, the project URL and the publishable (anon) key.
          eval "$(python3 -c 'import json, shlex; env = json.load(open("eas.json"))["build"]["base"]["env"]; print("\n".join(f"export {k}={shlex.quote(v)}" for k, v in env.items()))')"
          WEB_BASE_URL=/cookmate/app npx expo export --platform web --output-dir ../../_site/app
          python3 ../../tools/web/finalize.py ../../_site/app /cookmate/app
      - name: Fill in contact details
        id: fill
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          OPERATOR: ${{ vars.OPERATOR }}
        run: |
          set -euo pipefail
          if [ -z "$SUPPORT_EMAIL" ] || [ -z "$OPERATOR" ]; then
            echo "::notice::Set the repository variables SUPPORT_EMAIL and OPERATOR to publish the privacy and deletion pages. Publishing the web app only."
            exit 0
          fi
          effective=$(git log -1 --format=%cs -- site/privacy.html)
          [ -n "$effective" ] || effective=$(date -u +%F)
          mkdir -p _site
          cp site/*.css site/*.png _site/
          for f in site/*.html; do
            python3 - "$f" "_site/$(basename "$f")" "$SUPPORT_EMAIL" "$OPERATOR" "$effective" <<'PY'
          import html, sys
          src, dst, email, operator, effective = sys.argv[1:]
          text = open(src, encoding="utf-8").read()
          text = (text.replace("{{SUPPORT_EMAIL}}", html.escape(email))
                      .replace("{{OPERATOR}}", html.escape(operator))
                      .replace("{{EFFECTIVE_DATE}}", effective))
          assert "{{" not in text, f"unfilled placeholder in {src}"
          open(dst, "w", encoding="utf-8").write(text)
          PY
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
