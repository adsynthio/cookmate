description: A crisp, lacy South Indian dosa made from a thin batter of semolina, rice flour and a little refined flour, flecked
  with onion, green chilli, ginger, cumin and curry leaves. It needs no grinding or fermenting. Serve hot with coconut chutney
  or sambar.
descriptions:
  hi: सूजी, चावल के आटे और थोड़े मैदे के पतले घोल से बना कुरकुरा, जालीदार दक्षिण भारतीय डोसा। इसमें प्याज़, हरी मिर्च, अदरक,
    जीरा और करी पत्ता पड़ता है। न पीसना है, न खमीर उठाना है। गरम-गरम नारियल चटनी या सांभर के साथ परोसें।
  hi-Latn: Suji, chawal ke aate aur thode maide ke patle ghol se bana crispy, jaalidaar South Indian dosa. Isme pyaaz, hari
    mirch, adrak, jeera aur curry patta padta hai. Na peesna hai, na khameer uthana hai. Garam-garam nariyal chutney ya sambar
    ke saath parosein.
