name: Write a library batch

# docs/AI_RECIPES_PLAN.md, Phase 1: Claude writes draft recipes for the next dishes in content/dish_list.yaml.
# Every draft passes the recipe safety gate and the content build, gets one rewrite if not, and the batch opens
# as a pull request with review_status in_review. Nothing reaches the app until Gaurav approves and merges it.
# Started by hand only (Actions > Write a library batch > Run workflow). Needs the repository secret
# ANTHROPIC_API_KEY, used only by this job; without it the job says so and does nothing.

on:
  workflow_dispatch:
    inputs:
      size:
        description: How many dishes (at most 25)
        required: false
        default: "25"
      groups:
        description: "Dish list groups to mix, e.g. breakfast,everyday_sabzi (empty: next in list order)"
        required: false
        default: ""

concurrency:
  group: library-batch
  cancel-in-progress: false

# Writes a branch and opens a pull request (the drafts are also kept with the run); nothing else.
permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check the key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; no batch written."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: denoland/setup-deno@v2
        if: steps.key.outputs.ok == 'true'
        with:
          deno-version: "2.9.6"
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Write the drafts
        if: steps.key.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIZE: ${{ github.event.inputs.size }}
          GROUPS: ${{ github.event.inputs.groups }}
        run: |
          size=$(( SIZE > 25 ? 25 : (SIZE < 1 ? 1 : SIZE) ))
          deno run --allow-read --allow-write --allow-env --allow-net tools/content/generate/generate.ts --size "$size" --groups "$GROUPS" > report.md
          cat report.md
      - name: YAML, content build and the safety gate on every recipe
        if: steps.key.outputs.ok == 'true'
        run: |
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 tools/content/generate/to_yaml.py
          python3 tools/content/build.py
          python3 tools/media/sync.py
          cd apps/mobile && npm ci && node --test --experimental-strip-types src/domain/recipeSafety.test.ts src/domain/recipeSafety.cases.test.ts
      - name: Commit the drafts
        id: commit
        if: steps.key.outputs.ok == 'true'
        run: |
          if [ -z "$(git status --porcelain content/recipes)" ]; then
            echo "::notice::No drafts passed; see the report above."
            echo "has=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="library/batch-${{ github.run_number }}"
          git checkout -b "$branch"
          git -c user.name=Gaurav -c user.email=adsynthio@users.noreply.github.com add content/recipes supabase/seed.sql apps/mobile/src/data apps/mobile/src/design-system/media.ts supabase/functions/_shared/catalog.json
          git -c user.name=Gaurav -c user.email=adsynthio@users.noreply.github.com commit -q -m "Library batch ${{ github.run_number }}: draft recipes for review"
          # The batch as one patch, kept with the run: if the push below fails, `git am batch.patch` on main restores it.
          git format-patch -1 --stdout > batch.patch
          {
            echo "Draft recipes written by the library generator (docs/AI_RECIPES_PLAN.md, Phase 1)."
            echo
            echo "**Gaurav: please review before merging.** Each recipe passed the content build and the recipe safety gate."
            echo "To approve a recipe, change its review_status to approved; merge when the batch is ready."
            echo
            cat report.md
          } > body.md
          echo "has=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      # Kept before the push, so a dropped connection can't lose a batch the API has already been paid for.
      - name: Keep the drafts with the run
        if: steps.commit.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: library-batch-${{ github.run_number }}
          path: |
            batch.patch
            body.md
          retention-days: 30
      - name: Push and open the pull request
        if: steps.commit.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          # A push can fail on a network blip: four tries, waiting 10, 20, 40 seconds between them.
          for wait in 10 20 40 0; do
            git push -q -u origin "$BRANCH" && break
            if [ "$wait" = 0 ]; then
              echo "::error::Couldn't push $BRANCH. The drafts are kept with this run (library-batch-${{ github.run_number }}): apply batch.patch on main with git am."
              exit 1
            fi
            sleep "$wait"
          done
          # If the repository doesn't let Actions open pull requests, the branch is still pushed: open it by hand.
          gh pr create --base main --head "$BRANCH" --title "Library batch ${{ github.run_number }}: draft recipes for review" --body-file body.md \
            || echo "::notice::The drafts are on branch $BRANCH. Open the pull request: https://github.com/${{ github.repository }}/pull/new/$BRANCH"
