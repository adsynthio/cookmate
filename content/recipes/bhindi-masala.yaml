steps:
- text: Wash the okra, wipe every piece completely dry with a cloth, trim the ends and cut it into 2 cm pieces.
  minutes: 10
  timer: true
  cues:
    touch: The okra should feel fully dry before you cut it, so it stays less slimy.
  safety: Use a dry board and take care with the knife, because wet okra slips.
  say:
    hi:
      text: भिंडी धो लें, हर भिंडी को कपड़े से पूरा सूखा पोंछें, सिरे काटें और 2 सेंटीमीटर के टुकड़े कर लें।
      touch: काटने से पहले भिंडी पूरी सूखी लगनी चाहिए, इससे वह कम चिपचिपी रहती है।
      safety: सूखा बोर्ड लें और चाकू ध्यान से चलाएँ, क्योंकि गीली भिंडी फिसलती है।
    hi-Latn:
      text: Bhindi dho lein, har bhindi ko kapde se poora sookha ponchhein, sire kaatein aur 2 centimetre ke tukde kar lein.
      touch: Kaatne se pehle bhindi poori sookhi lagni chahiye, isse woh kam chipchipi rehti hai.
      safety: Sookha board lein aur chaaku dhyaan se chalaayein, kyunki geeli bhindi phisalti hai.
- text: Heat 2 tablespoons of oil in a kadai. Add the okra and fry it uncovered, stirring now and then, until it is no longer
    slimy and the edges brown. Take it out onto a plate.
  technique: shallow_fry
  minutes: 12
  timer: true
  heat: medium
  cues:
    look: The sticky strings are gone and the edges are lightly browned.
  say:
    hi:
      text: कड़ाही में 2 बड़े चम्मच तेल गरम करें। भिंडी डालें और बिना ढके, बीच-बीच में चलाते हुए तब तक भूनें जब तक चिपचिपाहट
        न चली जाए और किनारे भूरे न हो जाएँ। फिर भिंडी निकालकर प्लेट में रख लें।
      look: चिपचिपे तार खत्म हो जाएँ और किनारे हल्के भूरे हो जाएँ।
    hi-Latn:
      text: Kadai mein 2 bade chammach tel garam karein. Bhindi daalein aur bina dhake, beech-beech mein chalaate hue tab
        tak bhoonein jab tak chipchipahat na chali jaaye aur kinaare bhoore na ho jaayein. Phir bhindi nikaal kar plate mein
        rakh lein.
      look: Chipchipe taar khatam ho jaayein aur kinaare halke bhoore ho jaayein.
- text: Add the remaining oil to the same kadai and put in the cumin seeds. When they crackle, add the sliced onion and cook
    it until golden.
  technique: saute_onion
  minutes: 6
  timer: true
  heat: medium
  cues:
