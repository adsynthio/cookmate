steps:
- text: Finely chop the onion, tomato, green chilli and ginger, and dice the carrot small.
  minutes: 5
  timer: true
  say:
    hi:
      text: प्याज़, टमाटर, हरी मिर्च और अदरक बारीक काट लो, और गाजर छोटे टुकड़ों में काट लो।
