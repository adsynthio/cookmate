steps:
- text: Wash the black urad and rajma together and soak them overnight, at least 8 hours, in plenty of water.
  technique: soak
  minutes: 480
  timer: true
  cues:
    look: The beans swell to nearly double in size.
  say:
    hi:
      text: काली उड़द और राजमा को साथ में धोकर खूब सारे पानी में रात भर, कम से कम 8 घंटे, भिगो दें।
      look: दाने फूलकर लगभग दोगुने हो जाते हैं।
    hi-Latn:
      text: Kaali urad aur rajma ko saath mein dhokar khoob saare paani mein raat bhar, kam se kam 8 ghante, bhigo dein.
      look: Daane phoolkar lagbhag dogune ho jaate hain.
- text: 'Drain and throw away the soaking water, rinse, then pressure-cook with 900 ml fresh water and the salt: 7 whistles
    on medium heat, then 20 minutes on low.'
  technique: pressure_cook
  minutes: 40
  whistles: 7
  timer: true
  heat: medium
  cues:
    sound: Steady hiss and whistles from the cooker.
  safety: Rajma must never be cooked in its soaking water or left half-cooked.
  say:
    hi:
      text: भिगोने वाला पानी निकालकर फेंक दें, दाल धो लें, फिर 900 ml ताज़ा पानी और नमक डालकर कुकर में मध्यम आँच पर 7 सीटी
        लगाएँ, फिर धीमी आँच पर 20 मिनट पकाएँ।
      sound: कुकर से लगातार सीटी और भाप की आवाज़ आती है।
      safety: राजमा को कभी भिगोने वाले पानी में न पकाएँ और न ही आधा कच्चा छोड़ें।
    hi-Latn:
      text: Bhigone wala paani nikaal kar phenk dein, dal dho lein, phir 900 ml taaza paani aur namak daalkar cooker mein
        medium aanch par 7 seeti lagayein, phir dheemi aanch par 20 minute pakayein.
      sound: Cooker se lagataar seeti aur bhaap ki awaaz aati hai.
      safety: Rajma ko kabhi bhigone wale paani mein na pakayein aur na hi aadha kachcha chhodein.
- text: Turn off the heat and open the cooker only after the pressure has dropped by itself, then check the rajma; if any
    bean is not fully soft, cook 2 to 3 more whistles.
  minutes: 15
  timer: true
  cues:
    touch: Every rajma mashes completely between your fingers with no hard centre.
  safety: Never force the cooker open; wait till all the pressure is gone on its own.
  say:
    hi:
      text: आँच बंद कर दें और कुकर तभी खोलें जब प्रेशर अपने आप पूरा निकल जाए, फिर राजमा जाँचें; अगर कोई दाना पूरा नरम न हो
        तो 2-3 सीटी और लगाएँ।
      touch: हर राजमा उंगलियों के बीच पूरा मसल जाए, बीच में कोई सख़्ती न हो।
      safety: कुकर ज़बरदस्ती कभी न खोलें; प्रेशर अपने आप पूरा निकलने तक रुकें।
    hi-Latn:
      text: Aanch band kar dein aur cooker tabhi kholein jab pressure apne aap poora nikal jaaye, phir rajma check karein;
        agar koi daana poora naram na ho to 2-3 seeti aur lagayein.
      touch: Har rajma ungliyon ke beech poora masal jaaye, beech mein koi sakhti na ho.
      safety: Cooker zabardasti kabhi na kholein; pressure apne aap poora nikalne tak rukein.
