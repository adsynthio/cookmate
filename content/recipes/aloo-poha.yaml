steps:
- text: Rinse the poha in a strainer under running water 2 to 3 times, drain well, mix in the sugar and half the salt and
    let it rest.
  technique: soak
  minutes: 10
  timer: true
  cues:
    touch: Each flake presses soft between fingers but the grains stay separate, not mushy.
  say:
    hi:
      text: पोहे को छलनी में बहते पानी में 2-3 बार धोएं, पानी अच्छे से निकाल दें, उसमें चीनी और आधा नमक मिलाकर रख दें।
      touch: हर दाना उंगलियों में दबाने पर नरम हो, पर दाने अलग-अलग रहें, गीले-चिपचिपे नहीं।
    hi-Latn:
      text: Poha ko chhalni mein behte paani mein 2-3 baar dhoyein, paani achhe se nikaal dein, usmein cheeni aur aadha namak
