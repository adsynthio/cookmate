steps:
- text: Wash the toor dal 2 to 3 times and soak it in water for 15 minutes.
  technique: soak
  minutes: 15
  timer: true
  cues:
    look: The washing water runs almost clear.
  say:
    hi:
      text: अरहर दाल को 2 से 3 बार धोकर 15 मिनट पानी में भिगो दें।
      look: धोने का पानी लगभग साफ़ दिखने लगे।
    hi-Latn:
      text: Arhar dal ko 2 se 3 baar dhokar 15 minute paani mein bhigo dein.
      look: Dhone ka paani lagbhag saaf dikhne lage.
- text: Drain the dal, put it in the pressure cooker with 3 cups water, the turmeric and half the salt, and cook for 3 whistles
    on medium heat.
  technique: pressure_cook
  minutes: 12
  whistles: 3
  timer: true
  heat: medium
  cues:
    look: The dal is fully soft and breaks down when stirred.
    touch: A grain mashes easily between your fingers.
  safety: Let the pressure drop on its own before you open the lid.
  say:
    hi:
      text: दाल का पानी निकालकर कुकर में 3 कप पानी, हल्दी और आधा नमक डालें और मध्यम आंच पर 3 सीटी आने दें।
      look: दाल पूरी नरम हो और चलाने पर घुल जाए।
      touch: दाल का दाना उंगलियों के बीच आसानी से मसल जाए।
      safety: ढक्कन खोलने से पहले प्रेशर अपने आप निकलने दें।
    hi-Latn:
      text: Dal ka paani nikaalkar cooker mein 3 cup paani, haldi aur aadha namak daalein aur medium aanch par 3 seeti aane
        dein.
      look: Dal poori naram ho aur chalane par ghul jaaye.
      touch: Dal ka daana ungliyon ke beech aasaani se masal jaaye.
      safety: Dhakkan kholne se pehle pressure apne aap nikalne dein.
- text: While the dal cooks, wash the spinach in a big bowl of water 2 to 3 times and chop it roughly.
  cues:
    look: No mud or grit is left at the bottom of the bowl.
  say:
    hi:
      text: दाल पकने तक पालक को बड़े बर्तन में पानी में 2 से 3 बार धोएं और मोटा-मोटा काट लें।
      look: बर्तन की तली में मिट्टी या रेत न बचे।
    hi-Latn:
      text: Dal pakne tak palak ko bade bartan mein paani mein 2 se 3 baar dhoyein aur mota-mota kaat lein.
      look: Bartan ki tali mein mitti ya ret na bache.
- text: Heat the ghee in a kadai, add cumin and hing, then the chopped garlic, ginger, green chilli and onion, and fry until
    the onion turns golden.
  technique: saute_onion
  minutes: 6
  timer: true
  heat: medium
  cues:
    look: The onion turns soft and golden at the edges.
    sound: The cumin crackles as soon as it hits the ghee.
    smell: The garlic smells nutty, not raw.
  say:
    hi:
      text: कढ़ाई में घी गरम करें, जीरा और हींग डालें, फिर कटा लहसुन, अदरक, हरी मिर्च और प्याज़ डालकर प्याज़ सुनहरा होने तक
        भूनें।
      look: प्याज़ नरम और किनारों से सुनहरा हो जाए।
      sound: घी में डालते ही जीरा चटकने लगे।
      smell: लहसुन की कच्ची नहीं, भुनी हुई खुशबू आए।
    hi-Latn:
      text: Kadai mein ghee garam karein, jeera aur hing daalein, phir kata lahsun, adrak, hari mirch aur pyaaz daalkar pyaaz
        sunehra hone tak bhunein.
      look: Pyaaz naram aur kinaaron se sunehra ho jaaye.
      sound: Ghee mein daalte hi jeera chatakne lage.
      smell: Lahsun ki kachchi nahin, bhuni hui khushboo aaye.
- text: Add the chopped tomato, red chilli powder and coriander powder and cook until the tomato is mushy.
  technique: bhuna
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: Ghee starts showing at the edges of the masala.
  say:
    hi:
      text: कटा टमाटर, लाल मिर्च पाउडर और धनिया पाउडर डालें और टमाटर गलने तक पकाएं।
