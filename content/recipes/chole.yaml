description: Soft, slow-simmered chickpeas in a thick, tangy onion-tomato masala. This is the everyday home-style chole that
  goes with rice, roti or bhature.
descriptions:
  hi: प्याज़-टमाटर के गाढ़े, चटपटे मसाले में धीमी आँच पर पके नरम छोले। रोज़ के घर वाले छोले, जो चावल, रोटी या भटूरे के साथ
    खूब जमते हैं।
  hi-Latn: Pyaaz-tamatar ke gaadhe, chatpate masale mein dheemi aanch par pake naram chhole. Roz ke ghar wale chhole, jo chawal,
    roti ya bhature ke saath khoob jamte hain.
