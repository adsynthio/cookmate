      look: पत्ते चमकीले हरे होकर नरम पड़ जाते हैं।
      safety: उबलता पानी अपने से दूर की तरफ़ गिराएँ ताकि भाप से न जलें।
    hi-Latn:
      text: Palak ko achhe se dhokar bade bartan mein ubalte paani mein 2 minute ubaalein, phir chhaankar turant thande paani
