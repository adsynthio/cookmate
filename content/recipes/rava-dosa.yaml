steps:
- text: In a big bowl, mix the semolina, rice flour, refined flour and salt, then whisk in about 800 ml water to make a thin,
    lump-free batter. Rest it for 20 minutes.
  technique: soak
  minutes: 20
  timer: true
  cues:
    look: The batter is watery, like thin buttermilk.
  say:
    hi:
      text: एक बड़े बर्तन में सूजी, चावल का आटा, मैदा और नमक मिलाइए, फिर लगभग 800 ml पानी डालकर फेंटते हुए पतला, बिना गुठली
        का घोल बनाइए। इसे 20 मिनट रख दीजिए।
      look: घोल पानी जैसा पतला दिखे, पतली छाछ की तरह।
    hi-Latn:
      text: Ek bade bartan mein suji, chawal ka aata, maida aur namak milaiye, phir lagbhag 800 ml paani daalkar phentte hue
        patla, bina guthli ka ghol banaiye. Ise 20 minute rakh dijiye.
      look: Ghol paani jaisa patla dikhe, patli chhaachh ki tarah.
- text: Stir in the onion, green chilli, ginger, cumin seeds, crushed pepper, curry leaves and coriander leaves. The semolina
    soaks up water, so add a little more water if the batter has thickened.
  cues:
    look: It should still run freely off the ladle.
  say:
    hi:
      text: इसमें प्याज़, हरी मिर्च, अदरक, जीरा, कुटी काली मिर्च, करी पत्ता और हरा धनिया मिलाइए। सूजी पानी सोख लेती है, इसलिए
        घोल गाढ़ा हो गया हो तो थोड़ा पानी और डालिए।
      look: घोल कलछी से आसानी से बहता रहे।
    hi-Latn:
      text: Isme pyaaz, hari mirch, adrak, jeera, kuti kali mirch, curry patta aur hara dhaniya milaiye. Suji paani sokh leti
        hai, isliye ghol gaadha ho gaya ho to thoda paani aur daaliye.
      look: Ghol kalchhi se aasaani se behta rahe.
- text: Heat the tawa on high until it is very hot, then rub a few drops of oil over it and turn the heat to medium.
  technique: tawa_cook
  minutes: 3
  timer: true
  heat: high
  cues:
    sound: A few drops of water sprinkled on it sizzle away at once.
  safety: Keep your hand away from the hot tawa surface.
  say:
    hi:
      text: तवे को तेज़ आँच पर खूब गरम कीजिए, फिर उस पर कुछ बूँद तेल फैलाइए और आँच मध्यम कर दीजिए।
      sound: पानी के कुछ छींटे डालने पर वे तुरंत छनछनाकर उड़ जाएँ।
      safety: गरम तवे की सतह से हाथ दूर रखिए।
    hi-Latn:
