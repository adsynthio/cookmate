slug: besan-chilla
title: Besan Chilla
titles: {hi: बेसन चीला, hi-Latn: Besan Chilla}
description: >-
  Thin savoury pancakes of gram flour with onion, tomato and coriander, cooked on the tawa. Ready in twenty minutes.
descriptions:
  hi: "बेसन के पतले नमकीन चीले, प्याज़, टमाटर और धनिए के साथ, तवे पर बने। बीस मिनट में तैयार।"
  hi-Latn: "Besan ke patle namkeen cheele, pyaaz, tamatar aur dhaniye ke saath, tawe par bane. Bees minute mein taiyaar."
cuisine_region: generic_north
course: breakfast
diet: vegan
base_servings: 4
prep_time_min: 15
cook_time_min: 20
difficulty: 2
spice_level: 2
equipment: [tawa]
tags: [quick, high_protein, tiffin]
flavor_profile: {rich: 0.3, heat: 0.3, acid: 0.2, crunch: 0.3, starch: 0.4, sweet: 0}
food_groups: [dal]
review_status: draft
ingredients:
  - {ingredient: gram flour, qty: 180, unit: g, local: 3 katori besan, role: base}
  - {ingredient: onion, qty: 110, unit: g, local: 1 pyaaz, role: vegetable}
  - {ingredient: tomato, qty: 100, unit: g, local: 1 tamatar, role: vegetable}
  - {ingredient: green chilli, qty: 3, unit: g, local: 1 hari mirch, role: heat}
  - {ingredient: coriander leaves, qty: 10, unit: g, local: 1 mutthi, role: garnish}
  - {ingredient: carom seeds, qty: 1, unit: g, local: aadha chhota chammach, role: spice}
  - {ingredient: turmeric powder, qty: 0.75, unit: g, local: chauthai chhota chammach, role: spice}
  - {ingredient: red chilli powder, qty: 1.25, unit: g, local: aadha chhota chammach, role: heat}
  - {ingredient: salt, qty: 5, unit: g, local: 1 chhota chammach, role: spice}
  - {ingredient: refined oil, qty: 42, unit: ml, local: 3 chammach, role: fat}
steps:
  - text: Whisk the besan with turmeric, chilli powder, ajwain, salt and about 250 ml water into a smooth batter. Rest it for 10 minutes.
    technique: batter
    minutes: 10
    timer: true
    cue: Smooth and pourable, like thin dosa batter. No lumps.
    branch: {age_group: child, action: "Make the child's chillas first, before the green chilli goes into the batter"}
    cues:
      look: "Smooth and pourable, like thin dosa batter, with no lumps."
      touch: "It runs off the whisk in a steady ribbon."
    say:
      hi:
        text: "बेसन में हल्दी, मिर्च पाउडर, अजवाइन, नमक और लगभग 250 ml पानी डालकर फेंटें, चिकना घोल बनाएँ। 10 मिनट रखा रहने दें।"
        look: "घोल चिकना और बहने वाला हो, पतले डोसे के घोल जैसा, कोई गाँठ न हो।"
        touch: "घोल व्हिस्क से एक लगातार धार में गिरे।"
        branch: "हरी मिर्च डालने से पहले बच्चे के चीले पहले बना लें"
      hi-Latn:
        text: "Besan mein haldi, mirch powder, ajwain, namak aur lagbhag 250 ml paani daalkar phentein, chikna ghol banaayein. 10 minute rakha rehne dein."
        look: "Ghol chikna aur behne wala ho, patle dosa ghol jaisa, koi gaanth na ho."
        touch: "Ghol whisk se ek lagaataar dhaar mein gire."
        branch: "Hari mirch daalne se pehle bachche ke cheele pehle bana lein"
  - text: Stir in the finely chopped onion, tomato, green chilli and coriander.
    minutes: 2
    cues:
      look: "The vegetables are spread evenly through the batter."
    say:
      hi:
        text: "बारीक कटा प्याज़, टमाटर, हरी मिर्च और धनिया मिला दें।"
        look: "सब्ज़ियाँ पूरे घोल में बराबर फैली हों।"
      hi-Latn:
        text: "Bareek kata pyaaz, tamatar, hari mirch aur dhaniya mila dein."
        look: "Sabziyaan poore ghol mein barabar faili hon."
  - text: Heat the tawa on medium and grease it lightly. Pour a ladle of batter in the centre and spread it into a thin circle. Drizzle a little oil around the edge.
    technique: tawa_cook
    minutes: 2
    cue: Small bubbles appear and the edges start to lift on their own.
    heat: medium
    cues:
      look: "Small bubbles appear and the edges lift on their own."
      sound: "A gentle sizzle when the batter touches the tawa."
      avoid: "If the tawa smokes, take it off the flame for a few seconds first, or the chilla sticks and burns."
    say:
      hi:
        text: "तवा मध्यम आँच पर गरम करें और हल्का तेल लगाएँ। बीच में एक कलछी घोल डालें और पतला गोल फैलाएँ। किनारों पर थोड़ा तेल डालें।"
        look: "छोटे-छोटे बुलबुले आएँ और किनारे अपने आप उठने लगें।"
        sound: "घोल तवे पर पड़ते ही हल्की छन-छन आवाज़ आए।"
        avoid: "अगर तवे से धुआँ निकले तो कुछ सेकंड आँच से हटा लें, वरना चीला चिपक कर जल जाएगा।"
      hi-Latn:
        text: "Tawa madhyam aanch par garam karein aur halka tel lagaayein. Beech mein ek kalchhi ghol daalein aur patla gol phailaayein. Kinaaron par thoda tel daalein."
        look: "Chhote-chhote bulbule aayein aur kinaare apne aap uthne lagein."
        sound: "Ghol tawe par padte hi halki chhan-chhan awaaz aaye."
        avoid: "Agar tawe se dhuaan nikle to kuch second aanch se hata lein, warna cheela chipak kar jal jaayega."
  - text: Flip and cook the other side, pressing gently. Repeat with the rest of the batter.
    technique: tawa_cook
    minutes: 15
    cue: Golden-brown spots on both sides and no raw batter in the middle.
    heat: medium
    cues:
      look: "Golden-brown spots on both sides and no wet batter in the middle."
      smell: "Roasted besan, not raw flour."
      touch: "The middle springs back when pressed with the spatula."
    say:
      hi:
        text: "पलटें और हल्का दबाते हुए दूसरी तरफ़ सेकें। बाकी घोल से ऐसे ही बनाएँ।"
        look: "दोनों तरफ़ सुनहरे-भूरे निशान हों और बीच में गीला घोल न हो।"
        smell: "भुने बेसन की ख़ुशबू आए, कच्चे आटे की नहीं।"
        touch: "पलटे से दबाने पर बीच का हिस्सा वापस उभर आए।"
      hi-Latn:
        text: "Paltein aur halka dabaate hue doosri taraf sekein. Baaki ghol se aise hi banaayein."
        look: "Dono taraf sunehre-bhoore nishaan hon aur beech mein geela ghol na ho."
        smell: "Bhune besan ki khushboo aaye, kachche aate ki nahi."
        touch: "Palte se dabaane par beech ka hissa waapas ubhar aaye."
variation_rules:
  - {type: diet, condition: {diet: jain}, action: {omit: [onion]}, note: Use finely chopped capsicum instead of onion.}
  - {type: add, condition: {have: [paneer]}, action: {add: [{ingredient: paneer, qty: 100, unit: g}], at_step: 4}, note: Crumble paneer over the chilla before folding for a stuffed chilla.}
