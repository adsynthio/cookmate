  technique: saute_onion
  minutes: 3
  timer: true
  heat: medium
  cues:
    look: Onion is soft and translucent with light pink edges.
  say:
    hi:
      text: प्याज़, हरी मिर्च और अदरक डालकर प्याज़ नरम और हल्का गुलाबी होने तक भूनो।
      look: प्याज़ नरम और पारदर्शी हो, किनारे हल्के गुलाबी।
    hi-Latn:
      text: Pyaaz, hari mirch aur adrak daalkar pyaaz naram aur halka gulabi hone tak bhuno.
      look: Pyaaz naram aur transparent ho, kinare halke gulabi.
- text: Add carrot, peas, tomato, turmeric, red chilli powder and salt, and cook until the tomato turns mushy.
  technique: bhuna
  minutes: 4
  timer: true
  heat: medium
  cues:
    look: Tomato breaks down and oil shows at the edges.
  say:
    hi:
      text: गाजर, मटर, टमाटर, हल्दी, लाल मिर्च और नमक डालो, और टमाटर गलने तक पकाओ।
      look: टमाटर गल जाए और किनारों पर तेल दिखे।
    hi-Latn:
      text: Gajar, matar, tamatar, haldi, laal mirch aur namak daalo, aur tamatar galne tak pakao.
      look: Tamatar gal jaaye aur kinaron par tel dikhe.
- text: Pour in about 3 cups of water and bring it to a boil.
  minutes: 3
  timer: true
  heat: high
  cues:
