steps:
- text: Wash the chana dal 3 to 4 times, then soak it in plenty of water for 1 hour.
  technique: soak
  minutes: 60
  timer: true
  cues:
    look: The washing water runs almost clear.
  say:
    hi:
      text: चना दाल को 3-4 बार धो लें, फिर भरपूर पानी में 1 घंटे भिगो दें।
      look: धोने का पानी लगभग साफ़ दिखने लगे।
    hi-Latn:
      text: Chana dal ko 3-4 baar dho lein, phir bharpoor paani mein 1 ghante bhigo dein.
      look: Dhone ka paani lagbhag saaf dikhne lage.
- text: Drain the dal and add it to the pressure cooker with 750 ml water, the turmeric and the salt. Cook on medium heat
    for 4 whistles, then let the pressure drop on its own.
  technique: pressure_cook
  minutes: 15
  whistles: 4
  timer: true
  heat: medium
  cues:
    touch: A grain mashes easily between your fingers but still keeps its shape.
  safety: Open the lid only after all the pressure has released by itself.
  say:
    hi:
      text: दाल का पानी निकालकर उसे प्रेशर कुकर में 750 मि.ली. पानी, हल्दी और नमक के साथ डालें। मध्यम आँच पर 4 सीटी लगाएँ,
        फिर प्रेशर अपने आप उतरने दें।
      touch: दाना उंगलियों में आसानी से मसल जाए, पर अपना आकार बनाए रखे।
      safety: ढक्कन तभी खोलें जब सारा प्रेशर अपने आप निकल जाए।
    hi-Latn:
      text: Dal ka paani nikaalkar use pressure cooker mein 750 ml paani, haldi aur namak ke saath daalein. Medium aanch par
        4 seeti lagayein, phir pressure apne aap utarne dein.
      touch: Daana ungliyon mein aasani se masal jaaye, par apna shape banaye rakhe.
      safety: Dhakkan tabhi kholein jab saara pressure apne aap nikal jaaye.
- text: Heat the ghee in a kadai on medium heat, then add the cumin seeds and asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The cumin crackles.
