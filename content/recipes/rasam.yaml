steps:
- text: Wash the toor dal, add turmeric and 1 cup water, and pressure-cook for 3 whistles, then mash it smooth once the pressure
    drops.
  technique: pressure_cook
  minutes: 12
  whistles: 3
  timer: true
  heat: medium
  cues:
    look: The dal mashes into a smooth paste with no whole grains left.
  safety: Open the cooker only after the pressure drops by itself.
  say:
    hi:
      text: अरहर दाल धोकर उसमें हल्दी और 1 कप पानी डालें, प्रेशर कुकर में 3 सीटी तक पकाएं, फिर प्रेशर उतरने पर उसे चिकना मैश
        कर लें।
      look: दाल मैश होकर चिकनी हो जाती है, कोई साबुत दाना नहीं दिखता।
      safety: कुकर तभी खोलें जब प्रेशर अपने आप उतर जाए।
    hi-Latn:
      text: Toor dal dhokar usmein haldi aur 1 cup paani daalo, pressure cooker mein 3 seeti tak pakao, phir pressure utarne
        par use smooth mash kar lo.
      look: Dal mash hokar smooth ho jaati hai, koi saabut daana nahi dikhta.
      safety: Cooker tabhi kholo jab pressure apne aap utar jaaye.
- text: Soak the tamarind in 1 cup warm water for 10 minutes, squeeze it well and strain out the pulp water.
  technique: soak
  minutes: 10
  timer: true
  cues:
    touch: The tamarind turns soft and comes apart easily between your fingers.
  say:
    hi:
      text: इमली को 1 कप गुनगुने पानी में 10 मिनट भिगोएं, अच्छी तरह मसलें और उसका पानी छान लें।
      touch: इमली नरम हो जाती है और उंगलियों में आसानी से घुल जाती है।
    hi-Latn:
      text: Imli ko 1 cup gungune paani mein 10 minute bhigo do, achhi tarah masal kar uska paani chhaan lo.
      touch: Imli naram ho jaati hai aur ungliyon mein aasaani se ghul jaati hai.
- text: Coarsely crush the garlic, black pepper and cumin seeds together with a rolling pin or in a mortar.
  cues:
    look: Coarse, rough bits, not a fine powder.
    smell: A sharp smell of pepper and garlic.
  say:
    hi:
      text: लहसुन, काली मिर्च और जीरा को बेलन या खल-बट्टे से एक साथ दरदरा कूट लें।
      look: दरदरे टुकड़े दिखें, बारीक पाउडर नहीं।
      smell: काली मिर्च और लहसुन की तीखी खुशबू आती है।
    hi-Latn:
      text: Lahsun, kaali mirch aur jeera ko belan ya khal-batte se ek saath dardara kooti lo.
      look: Dardare tukde dikhen, baarik powder nahi.
      smell: Kaali mirch aur lahsun ki teekhi khushboo aati hai.
- text: In a kadai, add the tamarind water, chopped tomatoes, crushed masala, rasam powder, salt, a few curry leaves and jaggery
