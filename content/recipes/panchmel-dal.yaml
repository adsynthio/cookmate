- text: Pour the dal into the kadai and stir. Simmer on low heat for 5 minutes, stirring now and then.
  technique: simmer
  minutes: 5
  timer: true
  heat: low
  cues:
    look: The tadka is mixed through and the dal bubbles gently.
    sound: A soft blup-blup of bubbling.
  safety: The dal splutters as it bubbles, so stir with a long ladle.
