steps:
- text: Cut potato, carrot, beans, cauliflower and capsicum into small even pieces, and finely chop onion, tomato and green
    chilli.
  minutes: 10
  timer: true
  say:
    hi:
      text: आलू, गाजर, बीन्स, गोभी और शिमला मिर्च को छोटे बराबर टुकड़ों में काटो, और प्याज़, टमाटर व हरी मिर्च बारीक काट लो।
    hi-Latn:
      text: Aloo, gajar, beans, gobhi aur shimla mirch ko chhote barabar tukdon mein kaato, aur pyaaz, tamatar va hari mirch
        bareek kaat lo.
- text: Heat oil in a kadai, add cumin seeds, then add onion and fry until golden.
  technique: saute_onion
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: Onion turns light golden.
    sound: Cumin crackles as soon as it hits the oil.
  say:
    hi:
      text: कढ़ाई में तेल गरम करो, जीरा डालो, फिर प्याज़ डालकर सुनहरा होने तक भूनो।
      look: प्याज़ हल्का सुनहरा हो जाए।
      sound: तेल में डालते ही जीरा चटकने लगे।
    hi-Latn:
      text: Kadai mein tel garam karo, jeera daalo, phir pyaaz daalkar sunehra hone tak bhuno.
      look: Pyaaz halka sunehra ho jaaye.
      sound: Tel mein daalte hi jeera chatakne lage.
- text: Add ginger garlic paste and green chilli and stir for a minute.
  technique: saute_onion
  minutes: 1
  heat: medium
  cues:
    smell: The raw garlic smell goes away.
  say:
    hi:
      text: अदरक लहसुन पेस्ट और हरी मिर्च डालकर एक मिनट चलाओ।
      smell: लहसुन की कच्ची महक चली जाए।
    hi-Latn:
      text: Adrak lahsun paste aur hari mirch daalkar ek minute chalao.
      smell: Lahsun ki kachchi mehak chali jaaye.
- text: Add tomato, turmeric, red chilli powder, coriander powder and salt, and cook the masala until soft.
  technique: bhuna
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: Tomatoes turn mushy and oil shows at the edges.
  say:
    hi:
      text: टमाटर, हल्दी, लाल मिर्च पाउडर, धनिया पाउडर और नमक डालो, और मसाला नरम होने तक भूनो।
      look: टमाटर गल जाएं और किनारों पर तेल दिखने लगे।
    hi-Latn:
      text: Tamatar, haldi, laal mirch powder, dhaniya powder aur namak daalo, aur masala naram hone tak bhuno.
      look: Tamatar gal jaayein aur kinaron par tel dikhne lage.
- text: Add all the vegetables except capsicum, mix well with the masala, sprinkle about a quarter cup of water, cover and
    cook, stirring now and then.
  technique: simmer
  minutes: 12
  timer: true
  heat: low
  cues:
    touch: A knife goes easily through the potato and carrot.
  say:
    hi:
      text: शिमला मिर्च छोड़कर सारी सब्ज़ियां डालो, मसाले में अच्छे से मिलाओ, लगभग चौथाई कप पानी छिड़को, ढककर पकाओ और बीच-बीच
