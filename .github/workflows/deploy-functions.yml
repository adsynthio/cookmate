name: Deploy Edge Functions

# Deploys every function in supabase/functions to the hosted project. The sources are too large to send through
# the Supabase MCP, hence this job. Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard >
# Account > Access Tokens). Without it the job says so and does nothing.
# Function secrets (ANTHROPIC_API_KEY, LIVEKIT_*) are set in the dashboard, never here: without them each
# function answers from its rules fallback, and voice-token answers 503 voice_not_configured.

on:
  push:
    branches: [main]
    paths: [supabase/functions/**, .github/workflows/deploy-functions.yml]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: usuwwzkorhsbaaziaanl

# Read-only token: no job here writes to the repository (security review, finding 25).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for the access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; skipping the function deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest
      - name: Deploy all functions
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --yes: the CLI asks before changing a hosted project, and CI has no one to answer.
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
