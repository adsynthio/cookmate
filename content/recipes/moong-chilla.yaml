description: Thin, savoury pancakes made from soaked and ground yellow moong dal, with onion, green chilli, ginger and coriander.
  They are cooked on a tawa until golden and crisp at the edges. Serve hot with green chutney or ketchup.
descriptions:
  hi: भीगी और पिसी हुई पीली मूंग दाल से बने पतले, नमकीन चीले, जिनमें प्याज़, हरी मिर्च, अदरक और हरा धनिया पड़ता है। इन्हें
    तवे पर सुनहरा होने तक सेका जाता है, किनारे कुरकुरे हो जाते हैं। हरी चटनी या केचप के साथ गरम परोसें।
  hi-Latn: Bhigi aur pisi hui peeli moong dal se bane patle, namkeen chille, jinmein pyaaz, hari mirch, adrak aur hara dhaniya
    padta hai. Inhe tawe par sunehra hone tak seka jata hai, kinaare kurkure ho jaate hain. Hari chutney ya ketchup ke saath
    garam parosein.
