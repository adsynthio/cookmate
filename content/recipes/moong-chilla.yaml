steps:
- text: Wash the moong dal two or three times and soak it in plenty of water for 3 hours.
  technique: soak
  minutes: 180
  timer: true
  cues:
    look: The dal swells and breaks easily when pressed between your fingers.
  say:
    hi:
      text: मूंग दाल को दो-तीन बार धोकर भरपूर पानी में 3 घंटे भिगो दें।
      look: दाल फूल जाती है और उंगलियों से दबाने पर आसानी से टूट जाती है।
    hi-Latn:
      text: Moong dal ko do-teen baar dhokar bharpoor paani mein 3 ghante bhigo dein.
      look: Dal phool jaati hai aur ungliyon se dabane par aasaani se toot jaati hai.
- text: Drain the dal and grind it with ginger, green chilli and about half a cup of water into a smooth, thick batter.
  technique: batter
  minutes: 3
  timer: true
  cues:
    touch: The batter feels smooth with no gritty bits when rubbed between your fingers.
  say:
    hi:
      text: दाल का पानी निकाल दें और उसे अदरक, हरी मिर्च और लगभग आधा कप पानी के साथ पीसकर चिकना, गाढ़ा घोल बना लें।
      touch: उंगलियों में रगड़ने पर घोल चिकना लगता है और उसमें दरदरापन नहीं होता।
    hi-Latn:
      text: Dal ka paani nikaal dein aur use adrak, hari mirch aur lagbhag aadha cup paani ke saath peeskar chikna, gaadha
        ghol bana lein.
      touch: Ungliyon mein ragadne par ghol chikna lagta hai aur usmein dardarapan nahi hota.
- text: Stir in salt, turmeric, cumin seeds, asafoetida, onion, tomato if using, and coriander leaves, adding a little water
    to make a pourable batter.
  cues:
    look: The batter flows slowly off the ladle, like dosa batter.
  say:
    hi:
      text: घोल में नमक, हल्दी, जीरा, हींग, प्याज़, टमाटर (अगर डाल रहे हैं) और हरा धनिया मिलाएं, और थोड़ा पानी डालकर घोल को
        बहने लायक बना लें।
      look: घोल करछी से धीरे-धीरे गिरता है, डोसे के घोल जैसा।
    hi-Latn:
      text: Ghol mein namak, haldi, jeera, hing, pyaaz, tamatar (agar daal rahe hain) aur hara dhaniya milayein, aur thoda
        paani daalkar ghol ko behne laayak bana lein.
      look: Ghol karchhi se dheere-dheere girta hai, dose ke ghol jaisa.
- text: Heat the tawa on medium heat and wipe it with a few drops of oil.
  minutes: 2
  heat: medium
  cues:
    sound: A few drops of water sprinkled on the tawa sizzle and vanish at once.
  say:
    hi:
      text: तवे को मध्यम आंच पर गरम करें और उस पर कुछ बूंदें तेल लगाकर पोंछ दें।
      sound: तवे पर पानी के छींटे मारने पर वे छनछनाकर तुरंत उड़ जाते हैं।
    hi-Latn:
      text: Tawe ko madhyam aanch par garam karein aur us par kuch boondein tel lagakar ponchh dein.
      sound: Tawe par paani ke chheente maarne par woh chhanchhanakar turant ud jaate hain.
- text: Pour a ladle of batter in the centre and spread it quickly into a thin circle, then drizzle a little oil around the
    edges.
  technique: tawa_cook
  minutes: 2
  heat: medium
  cues:
    look: The top turns dry, and the edges lift and turn golden.
  say:
    hi:
      text: बीच में एक करछी घोल डालें और जल्दी से पतला गोल फैला दें, फिर किनारों पर थोड़ा तेल डालें।
      look: ऊपर की सतह सूख जाती है और किनारे उठकर सुनहरे हो जाते हैं।
    hi-Latn:
      text: Beech mein ek karchhi ghol daalein aur jaldi se patla gol phaila dein, phir kinaaron par thoda tel daalein.
      look: Upar ki satah sookh jaati hai aur kinaare uthkar sunehre ho jaate hain.
- text: Flip the chilla and cook the other side until brown spots appear, then serve hot and make the rest the same way.
  technique: tawa_cook
  minutes: 2
  heat: medium
  cues:
    look: Both sides have golden-brown spots.
    smell: It smells of roasted dal.
