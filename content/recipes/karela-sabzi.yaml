description: A dry North Indian everyday sabzi of thin bitter gourd slices fried with onions until crisp-edged. It is spiced
  with chilli, coriander and tangy amchur, with a little jaggery to round off the bitterness. Good with roti and dal.
descriptions:
  hi: रोज़ की सूखी उत्तर भारतीय सब्ज़ी। करेले के पतले टुकड़े प्याज़ के साथ किनारे कुरकुरे होने तक भूने जाते हैं। इसमें मिर्च,
    धनिया और खट्टा अमचूर पड़ता है, और कड़वाहट संभालने के लिए थोड़ा गुड़। रोटी और दाल के साथ बढ़िया लगती है।
  hi-Latn: Roz ki sookhi North Indian sabzi. Karele ke patle tukde pyaaz ke saath kinare kurkure hone tak bhune jaate hain.
    Isme mirch, dhaniya aur khatta amchur padta hai, aur kadwahat sambhalne ke liye thoda gud. Roti aur dal ke saath badhiya
    lagti hai.
