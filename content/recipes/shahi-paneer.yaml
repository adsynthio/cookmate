steps:
- text: Put chopped onion, tomato, cashews and green chilli in a pan with half a cup of water, cover and boil until the onion
    is soft, then let it cool.
  technique: simmer
  minutes: 8
  timer: true
  heat: medium
  cues:
    look: Onion turns soft and see-through.
  say:
    hi:
      text: कटा प्याज़, टमाटर, काजू और हरी मिर्च आधा कप पानी के साथ पैन में डालें, ढककर प्याज़ नरम होने तक उबालें, फिर ठंडा
        होने दें।
      look: प्याज़ नरम और पारदर्शी हो जाए।
    hi-Latn:
      text: Kata pyaaz, tamatar, kaju aur hari mirch aadha cup paani ke saath pan mein daalein, dhak kar pyaaz naram hone
        tak ubaalein, phir thanda hone dein.
      look: Pyaaz naram aur transparent ho jaaye.
- text: Grind the cooled mixture to a very smooth paste.
  cues:
    look: Paste is silky with no bits of cashew.
  safety: Grind only once it has cooled; hot mixture can burst out of the jar.
  say:
    hi:
      text: ठंडे मिश्रण को एकदम चिकना पीस लें।
      look: पेस्ट मुलायम हो, काजू के टुकड़े न दिखें।
      safety: ठंडा होने के बाद ही पीसें, गरम मिश्रण जार से उछल सकता है।
    hi-Latn:
      text: Thande mixture ko ekdum smooth pees lein.
      look: Paste silky ho, kaju ke tukde na dikhein.
      safety: Thanda hone ke baad hi peesein, garam mixture jar se uchhal sakta hai.
- text: Heat ghee in a kadai and add bay leaf, cardamom, cloves and cinnamon.
  technique: tadka
  minutes: 1
  heat: low
  cues:
    sound: Spices sizzle gently.
    smell: Warm, sweet spice smell rises.
  say:
    hi:
      text: कढ़ाई में घी गरम करें और तेज पत्ता, इलायची, लौंग और दालचीनी डालें।
      sound: मसाले हल्के से चटकें।
      smell: गरम मसालों की मीठी खुशबू आए।
    hi-Latn:
      text: Kadai mein ghee garam karein aur tej patta, elaichi, laung aur dalchini daalein.
      sound: Masale halke se chatkein.
      smell: Garam masalon ki meethi khushboo aaye.
- text: Add ginger garlic paste and stir until the raw smell goes.
  minutes: 1
  heat: low
  cues:
    smell: Raw garlic smell turns mellow.
  say:
    hi:
      text: अदरक लहसुन पेस्ट डालें और कच्ची महक जाने तक चलाएँ।
      smell: लहसुन की कच्ची महक नरम हो जाए।
    hi-Latn:
      text: Adrak lehsun paste daalein aur kachchi mehak jaane tak chalayein.
      smell: Lehsun ki kachchi mehak naram ho jaaye.
- text: Add the ground paste, kashmiri chilli powder and coriander powder, and cook stirring until ghee separates at the sides.
  technique: bhuna
  minutes: 10
  timer: true
  heat: medium
  cues:
    look: Masala darkens slightly and ghee shines at the edges.
  safety: The paste splutters; keep a lid half on and stir with a long spoon.
  say:
    hi:
      text: पिसा पेस्ट, कश्मीरी मिर्च और धनिया पाउडर डालें, और किनारों पर घी अलग होने तक चलाते हुए भूनें।
      look: मसाला थोड़ा गहरा हो जाए और किनारों पर घी चमके।
      safety: पेस्ट उछलता है, ढक्कन आधा रखें और लंबे चम्मच से चलाएँ।
    hi-Latn:
      text: Pisa paste, kashmiri mirch aur dhaniya powder daalein, aur kinaron par ghee alag hone tak chalate hue bhunein.
      look: Masala thoda gehra ho jaaye aur kinaron par ghee chamke.
      safety: Paste uchhalta hai, dhakkan aadha rakhein aur lambe chammach se chalayein.
- text: Pour in about one cup of water with salt and sugar, and simmer until the gravy is creamy.
  technique: simmer
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: Gravy coats the back of the spoon.
  say:
    hi:
      text: लगभग एक कप पानी, नमक और चीनी डालें, और ग्रेवी गाढ़ी-मलाईदार होने तक पकाएँ।
      look: ग्रेवी चम्मच के पीछे लिपटने लगे।
    hi-Latn:
      text: Lagbhag ek cup paani, namak aur cheeni daalein, aur gravy creamy hone tak pakayein.
      look: Gravy chammach ke peeche lipatne lage.
- text: Add paneer cubes, cream, crushed kasuri methi and garam masala, and cook gently without a hard boil.
  technique: simmer
  minutes: 3
  timer: true
  heat: low
  cues:
    touch: Paneer stays soft when pressed with the spoon.
  say:
    hi:
      text: पनीर के टुकड़े, क्रीम, मसली हुई कसूरी मेथी और गरम मसाला डालें, और तेज़ उबाल लाए बिना धीरे पकाएँ।
      touch: चम्मच से दबाने पर पनीर नरम रहे।
    hi-Latn:
      text: Paneer ke tukde, cream, masli hui kasuri methi aur garam masala daalein, aur tez ubaal laaye bina dheere pakayein.
      touch: Chammach se dabaane par paneer naram rahe.
- text: Turn off the heat, sprinkle coriander leaves and serve hot with roti or rice.
  say:
    hi:
      text: आँच बंद करें, ऊपर हरा धनिया डालें और रोटी या चावल के साथ गरम परोसें।
    hi-Latn:
      text: Aanch band karein, upar hara dhaniya daalein aur roti ya chawal ke saath garam serve karein.
