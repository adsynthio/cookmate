    hi-Latn:
      text: Dhakkan hatayein aur bacha hua paani sookhne tak chalate rahein.
      look: Kadai ke tale mein paani nahi bachta.
- text: Add the grated coconut and mix for a minute, then switch off the heat. Serve hot.
  minutes: 1
  heat: low
  cues:
    smell: It smells of toasted coconut.
