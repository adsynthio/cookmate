steps:
- text: Crumble the paneer with your fingers into small, uneven crumbs.
  cues:
    touch: The crumbs feel soft and there are no big lumps left.
  say:
    hi:
      text: पनीर को उंगलियों से छोटे-छोटे टुकड़ों में मसल लो।
      touch: टुकड़े नरम लगें और कोई बड़ी गांठ न बचे।
    hi-Latn:
      text: Paneer ko ungliyon se chhote-chhote tukdon mein masal lo.
      touch: Tukde naram lagein aur koi badi gaanth na bache.
- text: Heat the oil and butter in a kadai on medium heat, then add the cumin seeds.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The cumin crackles.
    smell: The cumin smells toasty.
  say:
    hi:
      text: कढ़ाई में तेल और मक्खन मध्यम आंच पर गरम करो, फिर जीरा डालो।
      sound: जीरा चटकने लगे।
      smell: जीरे की भुनी खुशबू आए।
    hi-Latn:
      text: Kadai mein tel aur makhan medium aanch par garam karo, phir jeera daalo.
      sound: Jeera chatakne lage.
      smell: Jeere ki bhuni khushboo aaye.
- text: Add the onion, green chilli and ginger and sauté until the onion turns soft and light golden.
  technique: saute_onion
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The onion turns light golden.
  say:
    hi:
      text: प्याज़, हरी मिर्च और अदरक डालकर तब तक भूनो जब तक प्याज़ नरम और हल्का सुनहरा न हो जाए।
      look: प्याज़ हल्का सुनहरा हो जाए।
    hi-Latn:
      text: Pyaaz, hari mirch aur adrak daalkar tab tak bhuno jab tak pyaaz naram aur halka sunehra na ho jaaye.
      look: Pyaaz halka sunehra ho jaaye.
- text: Add the tomato, salt, turmeric, red chilli powder and coriander powder, and cook until the tomato is mushy and the
