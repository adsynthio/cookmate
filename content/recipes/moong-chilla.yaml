      text: चीले को पलटें और दूसरी तरफ़ भूरे दाग आने तक सेकें, फिर गरम परोसें और बाकी चीले भी इसी तरह बनाएं।
      look: दोनों तरफ़ सुनहरे-भूरे दाग आ जाते हैं।
      smell: भुनी हुई दाल की खुशबू आती है।
      touch: बीच में दबाने पर चीला सख़्त लगता है, नरम या चिपचिपा नहीं।
