      smell: Sinkne ki achhi khushboo aaye.
- text: Flip the uttapam and cook the topping side until the onions are lightly browned.
  technique: tawa_cook
  minutes: 2
  heat: medium
  cues:
    sound: The vegetables sizzle against the tawa.
  safety: Flip away from you so hot oil does not splash on your hand.
  say:
    hi:
      text: उत्तपम पलटो और सब्ज़ी वाली तरफ़ प्याज़ हल्का भूरा होने तक सेंको।
