steps:
- text: Wash the moong 2 to 3 times and soak it in plenty of water for about 4 hours.
  technique: soak
  minutes: 240
  timer: true
  cues:
    look: The grains look swollen and a few skins start to split.
    touch: A soaked grain is plump and slightly soft when pressed.
  say:
    hi:
      text: मूंग को 2-3 बार धोकर भरपूर पानी में लगभग 4 घंटे भिगो दें।
      look: दाने फूले हुए दिखते हैं और कुछ के छिलके फटने लगते हैं।
      touch: भीगा दाना दबाने पर मोटा और हल्का नरम लगता है।
    hi-Latn:
      text: Moong ko 2-3 baar dhokar bharpoor paani mein lagbhag 4 ghante bhigo dein.
      look: Daane phoole hue dikhte hain aur kuch ke chhilke phatne lagte hain.
      touch: Bheega daana dabane par mota aur halka naram lagta hai.
- text: Drain the moong, put it in the pressure cooker with 700 ml water, the salt and turmeric, and cook for 4 whistles on
    medium heat.
  technique: pressure_cook
  minutes: 15
  whistles: 4
  timer: true
  heat: medium
  cues:
    look: After opening, the grains are soft and some have burst.
    touch: A grain mashes easily between two fingers.
  safety: Open the cooker only after the pressure has dropped on its own.
  say:
    hi:
      text: मूंग का पानी निकाल दें, कुकर में 700 ml पानी, नमक और हल्दी के साथ डालें और मध्यम आँच पर 4 सीटी लगाएँ।
      look: खोलने पर दाने नरम होते हैं और कुछ फट चुके होते हैं।
      touch: दाना दो उंगलियों के बीच आसानी से मसल जाता है।
      safety: कुकर तभी खोलें जब प्रेशर अपने आप पूरा निकल जाए।
    hi-Latn:
      text: Moong ka paani nikaal dein, cooker mein 700 ml paani, namak aur haldi ke saath daalein aur medium aanch par 4
        seeti lagayein.
      look: Kholne par daane naram hote hain aur kuch phat chuke hote hain.
      touch: Daana do ungliyon ke beech aasaani se masal jaata hai.
      safety: Cooker tabhi kholein jab pressure apne aap poora nikal jaaye.
- text: Heat the ghee in a kadai on medium heat, add the cumin seeds and then the asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
