steps:
- text: Wash the moth beans 2-3 times and soak them in plenty of water for 6 hours, then drain.
  technique: soak
  minutes: 360
  timer: true
  cues:
    look: The beans swell to almost double in size.
  say:
    hi:
      text: मोठ को 2-3 बार धोकर भरपूर पानी में 6 घंटे भिगो दें, फिर पानी निकाल दें।
      look: दाने फूलकर लगभग दोगुने हो जाते हैं।
    hi-Latn:
      text: Moth ko 2-3 baar dhokar bharpoor paani mein 6 ghante bhigo dein, phir paani nikaal dein.
      look: Daane phoolkar lagbhag dogune ho jaate hain.
- text: Pressure-cook the soaked moth with 700 ml water, the salt and turmeric for 4 whistles on medium heat, then let the
    pressure drop on its own.
  technique: pressure_cook
  minutes: 20
  whistles: 4
  timer: true
  heat: medium
  cues:
    touch: A bean mashes easily between your fingers.
  safety: Open the cooker only after the pressure has fully gone down.
  say:
    hi:
      text: भीगे मोठ को 700 ml पानी, नमक और हल्दी के साथ कुकर में मध्यम आँच पर 4 सीटी तक पकाएँ, फिर प्रेशर अपने आप उतरने दें।
      touch: दाना उँगलियों में आसानी से मसल जाता है।
      safety: कुकर तभी खोलें जब प्रेशर पूरी तरह उतर जाए।
    hi-Latn:
      text: Bheege moth ko 700 ml paani, namak aur haldi ke saath cooker mein medium aanch par 4 seeti tak pakayein, phir
        pressure apne aap utarne dein.
      touch: Daana ungliyon mein aasaani se masal jaata hai.
      safety: Cooker tabhi kholein jab pressure poori tarah utar jaaye.
- text: Heat ghee in a kadai, add cumin seeds and asafoetida, then add chopped garlic, ginger and green chilli and stir for
    a minute.
  technique: tadka
  minutes: 2
  heat: medium
  cues:
    sound: The cumin crackles in the ghee.
    smell: The raw garlic smell turns nutty.
  say:
    hi:
      text: कड़ाही में घी गरम करें, जीरा और हींग डालें, फिर कटा लहसुन, अदरक और हरी मिर्च डालकर एक मिनट चलाएँ।
      sound: घी में जीरा चटकता है।
      smell: लहसुन की कच्ची महक भुनी हुई खुशबू में बदल जाती है।
    hi-Latn:
      text: Kadai mein ghee garam karein, jeera aur hing daalein, phir kata lehsun, adrak aur hari mirch daalkar ek minute
        chalayein.
      sound: Ghee mein jeera chatakta hai.
      smell: Lehsun ki kachchi mehak bhuni hui khushboo mein badal jaati hai.
- text: Add the chopped onion and cook, stirring often, until golden.
  technique: saute_onion
  minutes: 6
  timer: true
  heat: medium
  cues:
    look: The onion turns light golden at the edges.
  say:
    hi:
      text: कटा प्याज़ डालें और बार-बार चलाते हुए सुनहरा होने तक पकाएँ।
      look: प्याज़ के किनारे हल्के सुनहरे हो जाते हैं।
    hi-Latn:
      text: Kata pyaaz daalein aur baar-baar chalaate hue sunehra hone tak pakayein.
      look: Pyaaz ke kinaare halke sunehre ho jaate hain.
- text: Add chopped tomato, red chilli powder and coriander powder and cook until the tomato is soft and the masala leaves
    ghee at the sides.
  technique: bhuna
  minutes: 6
  timer: true
  heat: medium
  cues:
    look: Ghee separates at the edges of the masala.
    touch: The tomato mashes under the spoon.
  say:
