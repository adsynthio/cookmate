      text: उसी कड़ाही में बचा तेल डालें, जीरा डालें, फिर बारीक प्याज़ मध्यम आँच पर सुनहरा होने तक भूनें।
      look: प्याज़ सुनहरा भूरा हो जाए।
      sound: तेल में पड़ते ही जीरा चटकने लगे।
      safety: पीछे हटकर रहें, जीरा डालते ही गरम तेल छिटक सकता है।
