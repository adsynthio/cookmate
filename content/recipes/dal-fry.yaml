steps:
- text: Wash the toor dal 3 to 4 times and soak it in water for 20 minutes, then drain.
  technique: soak
  minutes: 20
  timer: true
  cues:
    look: The washing water turns almost clear.
  say:
    hi:
      text: तूर दाल को 3-4 बार धोकर 20 मिनट पानी में भिगो दो, फिर पानी निकाल दो।
      look: धोने का पानी लगभग साफ़ दिखने लगे।
    hi-Latn:
      text: Toor dal ko 3-4 baar dhokar 20 minute paani mein bhigo do, phir paani nikaal do.
      look: Dhone ka paani lagbhag saaf dikhne lage.
- text: Put the dal in the pressure cooker with 3 cups water, the turmeric and half the salt, and cook on medium heat for
    3 whistles.
  technique: pressure_cook
  minutes: 12
  whistles: 3
  timer: true
  heat: medium
  safety: Open the cooker only after the pressure drops on its own.
  say:
    hi:
      text: दाल को प्रेशर कुकर में 3 कप पानी, हल्दी और आधे नमक के साथ डालो और मध्यम आँच पर 3 सीटी आने तक पकाओ।
      safety: कुकर तभी खोलो जब प्रेशर अपने आप उतर जाए।
    hi-Latn:
      text: Dal ko pressure cooker mein 3 cup paani, haldi aur aadhe namak ke saath daalo aur medium aanch par 3 seeti aane
        tak pakao.
      safety: Cooker tabhi kholo jab pressure apne aap utar jaaye.
- text: Open the cooker and whisk the dal lightly with a ladle until smooth.
  cues:
    look: The dal looks creamy, with no whole grains.
    touch: A grain crushes easily between your fingers.
  say:
    hi:
      text: कुकर खोलो और करछी से दाल को हल्का सा घोटकर एकसार कर लो।
      look: दाल मलाईदार दिखे, कोई साबुत दाना न रहे।
      touch: दाना उँगलियों के बीच आसानी से मसल जाए।
    hi-Latn:
      text: Cooker kholo aur karchhi se dal ko halka sa ghotkar eksaar kar lo.
      look: Dal malaidaar dikhe, koi saabut daana na rahe.
      touch: Daana ungliyon ke beech aasaani se masal jaaye.
- text: Heat the ghee and oil in a kadai on medium heat, then add the cumin seeds, dry red chillies and asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The cumin crackles.
  safety: Keep your face back, because hot ghee can splutter.
  say:
    hi:
      text: कढ़ाई में घी और तेल मध्यम आँच पर गरम करो, फिर जीरा, सूखी लाल मिर्च और हींग डालो।
      sound: जीरा चटकने लगे।
      safety: चेहरा दूर रखो, गरम घी छिटक सकता है।
    hi-Latn:
      text: Kadai mein ghee aur tel medium aanch par garam karo, phir jeera, sookhi laal mirch aur hing daalo.
      sound: Jeera chatakne lage.
      safety: Chehra door rakho, garam ghee chhitak sakta hai.
- text: Add the finely chopped onion and sauté until golden.
  technique: saute_onion
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The onion turns light golden at the edges.
  say:
    hi:
      text: बारीक कटा प्याज़ डालो और सुनहरा होने तक भूनो।
      look: प्याज़ किनारों से हल्का सुनहरा हो जाए।
    hi-Latn:
      text: Baarik kata pyaaz daalo aur sunehra hone tak bhuno.
      look: Pyaaz kinaaron se halka sunehra ho jaaye.
- text: Add the grated ginger, chopped garlic and slit green chillies and stir for 1 minute.
  minutes: 1
  heat: medium
  cues:
    smell: The raw garlic smell turns nutty.
  say:
    hi:
      text: कद्दूकस किया अदरक, कटा लहसुन और चीरी हुई हरी मिर्च डालकर 1 मिनट चलाओ।
      smell: लहसुन की कच्ची महक सोंधी हो जाए।
    hi-Latn:
      text: Kaddukas kiya adrak, kata lehsun aur cheeri hui hari mirch daalkar 1 minute chalao.
