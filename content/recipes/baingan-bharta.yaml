steps:
- text: Wash and dry the brinjal, rub a few drops of oil on it, make 4 small slits and push 4 garlic cloves inside, then roast
    it directly on the gas flame, turning with tongs until charred all over.
  minutes: 15
  timer: true
  heat: medium
  cues:
    look: The skin is black and blistered everywhere and the brinjal has shrunk and collapsed.
    smell: It smells smoky.
    touch: A knife goes through the thickest part with no resistance.
  safety: Turn the brinjal with tongs, not your fingers, and keep the dupatta or sleeves away from the flame.
  say:
    hi:
      text: बैंगन धोकर सुखा लें, उस पर कुछ बूँद तेल लगाएँ, 4 छोटे चीरे लगाकर 4 लहसुन की कलियाँ अंदर डालें, फिर सीधे गैस की
        आँच पर चिमटे से घुमाते हुए चारों तरफ़ से काला होने तक भूनें।
      look: छिलका हर तरफ़ से काला और फफोलेदार हो जाए और बैंगन सिकुड़कर ढीला पड़ जाए।
      smell: धुएँदार खुशबू आने लगे।
      touch: सबसे मोटे हिस्से में चाकू बिना रुकावट के घुस जाए।
      safety: बैंगन चिमटे से पलटें, उँगलियों से नहीं, और दुपट्टा या बाँह आँच से दूर रखें।
    hi-Latn:
      text: Baingan dhokar sukha lein, us par kuch boond tel lagayein, 4 chhote cheere lagakar 4 lehsun ki kaliyan andar daalein,
        phir seedhe gas ki aanch par chimte se ghumate hue chaaron taraf se kaala hone tak bhunein.
      look: Chhilka har taraf se kaala aur phapholedaar ho jaaye aur baingan sikudkar dheela pad jaaye.
      smell: Dhuandaar khushboo aane lage.
      touch: Sabse mote hisse mein chaaku bina rukawat ke ghus jaaye.
      safety: Baingan chimte se palatein, ungliyon se nahin, aur dupatta ya baanh aanch se door rakhein.
- text: Cover the roasted brinjal in a bowl for 5 minutes, then peel off the burnt skin, remove the stem and mash the pulp
    with the roasted garlic.
  minutes: 5
  timer: true
  cues:
    look: The pulp is soft, creamy and flecked with a little smoky skin.
  safety: The inside stays very hot, so let it cool a little before peeling.
  say:
    hi:
      text: भुने बैंगन को एक कटोरे में 5 मिनट ढककर रखें, फिर जला छिलका उतारें, डंठल हटाएँ और गूदे को भुने लहसुन के साथ मैश
        कर लें।
      look: गूदा नरम और मलाईदार हो, उसमें थोड़े धुएँदार छिलके के टुकड़े दिखें।
      safety: अंदर से बैंगन बहुत गरम रहता है, इसलिए छीलने से पहले थोड़ा ठंडा होने दें।
    hi-Latn:
