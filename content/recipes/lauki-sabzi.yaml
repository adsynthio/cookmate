steps:
- text: Peel the lauki, taste a tiny raw piece from the cut end, then cut it into 1 cm cubes; chop the tomatoes, ginger and
    green chillies.
  minutes: 8
  timer: true
  safety: If the lauki tastes bitter, spit it out and throw the whole lauki away; do not cook it.
  say:
    hi:
      text: लौकी छीलें, कटे सिरे से एक छोटा कच्चा टुकड़ा चखें, फिर उसे 1 सेमी के टुकड़ों में काटें; टमाटर, अदरक और हरी मिर्च
        बारीक काट लें।
      safety: अगर लौकी कड़वी लगे तो टुकड़ा थूक दें और पूरी लौकी फेंक दें; उसे न पकाएँ।
    hi-Latn:
      text: Lauki chheelein, kate sire se ek chhota kachcha tukda chakhein, phir use 1 cm ke tukdon mein kaatein; tamatar,
        adrak aur hari mirch baareek kaat lein.
      safety: Agar lauki kadvi lage to tukda thook dein aur poori lauki phenk dein; use na pakayein.
