      touch: Har daana ungliyon mein dabane par naram ho, par daane alag-alag rahein, geele-chipchipe nahin.
- text: Heat the oil in a kadai, fry the peanuts until golden and crunchy, then lift them out onto a plate.
  technique: shallow_fry
  minutes: 3
  timer: true
  heat: medium
  cues:
