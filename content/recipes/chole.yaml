steps:
- text: Wash the chickpeas and soak them in plenty of water for 8 hours or overnight.
  technique: soak
  minutes: 480
  timer: true
  cues:
    look: The chickpeas swell to about double their size.
  say:
    hi:
      text: छोले धोकर खूब सारे पानी में 8 घंटे या रात भर भिगो दें।
      look: छोले फूलकर लगभग दोगुने हो जाते हैं।
    hi-Latn:
      text: Chhole dhokar khoob saare paani mein 8 ghante ya raat bhar bhigo dein.
      look: Chhole phoolkar lagbhag doguna ho jaate hain.
- text: Drain the chickpeas and put them in the pressure cooker with 900 ml fresh water and half the salt. Cook for 5 whistles
    on medium heat, then let the pressure drop on its own.
  technique: pressure_cook
  minutes: 25
  whistles: 5
  timer: true
  heat: medium
  cues:
    touch: A chickpea mashes easily between two fingers.
  safety: Open the cooker only after the pressure has fully dropped by itself.
  say:
    hi:
      text: छोलों का पानी निकाल दें। प्रेशर कुकर में 900 ml ताज़ा पानी और आधा नमक डालकर छोले डालें। मध्यम आँच पर 5 सीटी लगाएँ,
        फिर प्रेशर अपने आप उतरने दें।
