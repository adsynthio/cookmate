steps:
- text: Scrape off the hard ridges of the ridge gourd, wash and cut it into small cubes; chop the onion, tomato and green
    chilli.
  say:
    hi:
      text: तोरी की सख़्त धारियाँ छील लो, धोकर छोटे टुकड़ों में काट लो; प्याज़, टमाटर और हरी मिर्च बारीक काट लो।
    hi-Latn:
      text: Tori ki sakht dhaariyan chheel lo, dhokar chhote tukdon mein kaat lo; pyaaz, tamatar aur hari mirch bareek kaat
        lo.
- text: Heat the oil in a kadai, add cumin seeds and asafoetida.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    look: The cumin turns a shade darker.
    sound: The cumin crackles.
  say:
    hi:
      text: कड़ाही में तेल गरम करो, जीरा और हींग डालो।
      look: जीरा थोड़ा गहरा हो जाए।
      sound: जीरा चटकने लगे।
    hi-Latn:
      text: Kadai mein tel garam karo, jeera aur hing daalo.
      look: Jeera thoda gehra ho jaaye.
      sound: Jeera chatakne lage.
- text: Add the onion and green chilli and fry until the onion turns light golden.
  technique: saute_onion
  minutes: 4
