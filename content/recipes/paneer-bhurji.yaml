description: Crumbled paneer tossed with onion, tomato and green chilli in a quick, soft, lightly spiced masala. It is ready
  in about 20 minutes and goes well with roti, paratha or buttered pav.
descriptions:
  hi: मसला हुआ पनीर प्याज़, टमाटर और हरी मिर्च के हल्के मसाले में जल्दी से पकाया जाता है। करीब 20 मिनट में बन जाता है और रोटी,
    पराठे या मक्खन लगे पाव के साथ बढ़िया लगता है।
  hi-Latn: Masla hua paneer pyaaz, tamatar aur hari mirch ke halke masale mein jaldi se pakaya jaata hai. Kareeb 20 minute
    mein ban jaata hai aur roti, parathe ya makhan lage pav ke saath badhiya lagta hai.
