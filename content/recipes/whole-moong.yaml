slug: whole-moong
title: Sabut Moong Dal
titles:
  hi: साबुत मूंग दाल
  hi-Latn: Sabut Moong Dal
description: A homely whole green moong dal, soaked and pressure-cooked soft, then simmered in a simple onion-tomato masala
  with a ghee and jeera tadka. Good with roti or rice on any weekday.
descriptions:
  hi: घर वाली साबुत हरी मूंग की दाल। मूंग को भिगोकर कुकर में नरम पकाया जाता है, फिर घी-जीरे के तड़के वाले सादे प्याज़-टमाटर
    मसाले में उबाला जाता है। किसी भी दिन रोटी या चावल के साथ बढ़िया लगती है।
  hi-Latn: Ghar wali sabut hari moong ki dal. Moong ko bhigokar cooker mein naram pakaya jaata hai, phir ghee-jeere ke tadke
    wale saade pyaaz-tamatar masale mein ubaala jaata hai. Kisi bhi din roti ya chawal ke saath badhiya lagti hai.
