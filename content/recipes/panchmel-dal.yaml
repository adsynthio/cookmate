      safety: उबलती दाल के छींटे उड़ते हैं, इसलिए लंबी करछी से चलाएँ।
    hi-Latn:
      text: Dal ko kadhai mein daal kar milayein. Dheemi aanch par 5 minute ubaalein, beech-beech mein chalaate rahein.
