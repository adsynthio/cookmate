steps:
- text: Wash the rajma well and soak it overnight, about 8 hours, in plenty of water.
  technique: soak
  minutes: 480
  timer: true
  cues:
    look: The beans swell to about double their size.
  safety: Rajma must always be soaked before cooking.
  say:
    hi:
      text: राजमा अच्छे से धोकर रात भर, लगभग 8 घंटे, खूब पानी में भिगो दें।
      look: दाने फूलकर लगभग दोगुने हो जाते हैं।
      safety: राजमा पकाने से पहले हमेशा भिगोना ज़रूरी है।
    hi-Latn:
      text: Rajma achhe se dhokar raat bhar, lagbhag 8 ghante, khoob paani mein bhigo dein.
      look: Daane phoolkar lagbhag dogune ho jaate hain.
      safety: Rajma pakaane se pehle hamesha bhigona zaroori hai.
- text: Throw away the soaking water and rinse the beans. Put them in the cooker with 900 ml fresh water, half the salt and
    the bay leaf. Cook for 6 whistles on medium heat, then 10 minutes on low, and let the pressure drop on its own.
  technique: pressure_cook
  minutes: 35
  whistles: 6
  timer: true
  heat: medium
  safety: Never cook rajma in its soaking water, and never slow-cook it from raw.
  say:
    hi:
      text: भिगोने वाला पानी फेंक दें और राजमा धो लें। कुकर में 900 ml ताज़ा पानी, आधा नमक और तेज पत्ता डालें। मध्यम आँच पर
        6 सीटी लगाएँ, फिर धीमी आँच पर 10 मिनट पकाएँ और प्रेशर अपने आप निकलने दें।
      safety: राजमा भिगोने वाले पानी में कभी न पकाएँ, और कच्चा राजमा कभी धीमी आँच पर स्लो-कुक न करें।
    hi-Latn:
      text: Bhigone wala paani phenk dein aur rajma dho lein. Cooker mein 900 ml taaza paani, aadha namak aur tej patta daalein.
        Medium aanch par 6 seeti lagayein, phir dheemi aanch par 10 minute pakayein aur pressure apne aap nikalne dein.
      safety: Rajma bhigone wale paani mein kabhi na pakayein, aur kachcha rajma kabhi dheemi aanch par slow-cook na karein.
- text: Open the cooker and press a few beans between your fingers. If any bean is still firm, cook 2 to 3 more whistles.
  cues:
    touch: Every bean mashes completely with no hard centre.
  safety: Undercooked rajma is unsafe to eat, so every bean must be completely soft.
  say:
    hi:
      text: कुकर खोलकर कुछ दाने उंगलियों से दबाकर देखें। अगर कोई दाना अब भी सख्त हो तो 2-3 सीटी और लगाएँ।
      touch: हर दाना पूरा मसल जाए, बीच में कोई सख्त हिस्सा न रहे।
      safety: कच्चा-पक्का राजमा खाना सुरक्षित नहीं है, इसलिए हर दाना पूरी तरह नरम होना चाहिए।
    hi-Latn:
      text: Cooker kholkar kuch daane ungliyon se dabaakar dekhein. Agar koi daana ab bhi sakht ho to 2-3 seeti aur lagayein.
      touch: Har daana poora masal jaaye, beech mein koi sakht hissa na rahe.
      safety: Kachcha-pakka rajma khana surakshit nahi hai, isliye har daana poori tarah naram hona chahiye.
