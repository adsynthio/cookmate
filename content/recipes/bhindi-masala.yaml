slug: bhindi-masala
title: Bhindi Masala
titles:
  hi: भिंडी मसाला
  hi-Latn: Bhindi Masala
description: A weekday dry okra sabzi. The bhindi is first fried until it is no longer slimy, then tossed in a quick onion-tomato
  masala and finished with amchur. It goes well with phulka or dal-chawal.
descriptions:
  hi: रोज़ के खाने वाली सूखी भिंडी की सब्ज़ी। भिंडी को पहले तब तक भूनते हैं जब तक उसकी चिपचिपाहट न चली जाए, फिर प्याज़-टमाटर
    के मसाले में मिलाकर अमचूर से खत्म करते हैं। फुलके या दाल-चावल के साथ बढ़िया लगती है।
  hi-Latn: Roz ke khaane wali sookhi bhindi ki sabzi. Bhindi ko pehle tab tak bhoonte hain jab tak uski chipchipahat na chali
    jaaye, phir pyaaz-tamatar ke masale mein milaakar amchur se khatam karte hain. Phulke ya dal-chawal ke saath badhiya lagti
    hai.
