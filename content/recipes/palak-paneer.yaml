steps:
- text: Wash the spinach well, boil it in a large pot of water for 2 minutes, then drain and put it straight into cold water.
  minutes: 2
  heat: high
  cues:
    look: Leaves turn bright green and go limp.
  safety: Pour the boiling water away from you to avoid steam burns.
  say:
    hi:
