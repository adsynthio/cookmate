# Feature flags (public.feature_flags). The seed inserts missing keys only; it never overwrites a value
# that was changed in the database, so operations can toggle flags without the next seed undoing them.

feature_flags:
  - key: voice_cook
    enabled: true
    rollout_pct: 100
    rules: {}

  # D5: free-tier voice cap. A config value, not code. Default 4 Voice Cook sessions per month.
  - key: voice_free_monthly_cap
    enabled: true
    rollout_pct: 100
    rules: {sessions_per_month: 4}

  - key: daily_pick_notification
    enabled: false
    rollout_pct: 0
    rules: {max_per_day: 1, quiet_hours: ["21:30", "07:00"]}

  - key: scan_pantry
    enabled: false
    rollout_pct: 0
    rules: {release: V1.5}

  # KIT-041: ranking weights for suggest-meals, tunable without a release. Keys match DEFAULT_WEIGHTS in
  # apps/mobile/src/domain/ranking.ts; missing keys fall back to those defaults.
  - key: ranking_weights
    enabled: true
    rollout_pct: 100
    rules: {weights: {coverage: 3, useSoon: 2, taste: 1.5, novelty: 1.5, time: 1, equipment: 1, calendar: 0.5, craving: 2.5, slot: 1.5}}

  # Staging only: let signed-in users see draft curated recipes so picks have content before the culinary lead
  # approves dishes (REC-01). Turn OFF in production; only approved recipes may reach real users there.
  - key: show_draft_recipes
    enabled: true
    rollout_pct: 100
    rules: {environment: staging}
