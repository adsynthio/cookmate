# Ingredient catalog (KIT-143). Source of truth for public.ingredients.
# Edit here, then run: python3 tools/content/build.py   (regenerates supabase/seed.sql)
#
# Fields
#   name       canonical English name, lowercase (unique)
#   hi, latn   Hindi in Devanagari and in Latin script (Hinglish); both used for parsing and display
#   aliases    other spellings and regional names
#   category   see public.ingredients.category
#   unit       default unit: g, ml, piece, bunch, packet (default g)
#   location   usual storage kind: fridge, freezer, pantry, staples, ready_made, counter
#   life       shelf life in days by storage kind (whole/unopened)
#   measures   grams per local measure (see MEASURES below)
#   groups     weekly-plate groups: dal, sabzi, greens, fruit, dairy, protein, grain
#   staple     tracked as Full/Low/Out instead of an exact quantity
#   allergens  milk, gluten, peanut, tree_nut, sesame, soy, egg, fish, shellfish, mustard
#   flags      content-tool only, not stored:
#                jain_avoid   root vegetables, onion, garlic, mushroom: a recipe using it cannot be jain
#                safety       a recipe using it must carry a food-safety note on at least one step
#                animal       animal product outside the dairy/egg/meat categories (e.g. honey): not vegan
#
# MEASURES (approximate; level, home utensils)
#   katori 150 ml bowl · cup 240 ml · chammach 15 ml tablespoon · chhota_chammach 5 ml teaspoon
#   mutthi one handful · chutki one pinch · piece one medium item · clove one garlic clove
#   inch one inch of root · bunch one market bunch
#
# Weights and shelf life are kitchen estimates for parsing and pantry nudges, not nutrition or safety advice.
# Every row should be checked by the culinary lead before launch.

