  hi: पनीर और आलू के नरम तले हुए कोफ्ते, प्याज़, टमाटर और काजू की चिकनी, हल्की मीठी ग्रेवी में, ऊपर से मलाई डालकर। रोटी, नान
    या जीरा राइस के साथ खास दिन के खाने के लिए उत्तर भारत की पसंदीदा सब्ज़ी।
  hi-Latn: Paneer aur aloo ke naram tale hue kofte, pyaaz, tamatar aur kaju ki smooth, halki meethi gravy mein, upar se malai
    daal kar. Roti, naan ya jeera rice ke saath khaas din ke khaane ke liye North Indian favourite sabzi.
