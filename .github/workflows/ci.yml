name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (schema + RLS tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generated schema is up to date with docs/architecture
        run: python3 tools/archgen/build.py --check
      - name: Install Postgres 16 with pgvector and pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgvector postgresql-16-pgtap
      - name: Apply migrations and run pgTAP tests
        run: sudo -E bash scripts/db/test-local.sh

  mobile:
    name: Mobile (typecheck + unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: No service keys in the app
        run: "! grep -rEn 'service_role|SERVICE_ROLE|sk-ant-' src app.json"

  voice-agent:
    name: Voice agent (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
