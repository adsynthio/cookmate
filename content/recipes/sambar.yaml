  technique: tadka
  minutes: 1
  heat: medium
  cues:
    sound: The mustard seeds pop and crackle.
    smell: The curry leaves smell fragrant.
  safety: Stand back as you add the curry leaves, because the hot oil splutters.
  say:
    hi:
      text: छोटे पैन में बचा हुआ तेल गरम करें, राई चटकाएँ, फिर मेथी दाना, सूखी लाल मिर्च, करी पत्ते और हींग डालें।
      sound: राई चट-चट करके फूटती है।
      smell: करी पत्तों से खुशबू आती है।
