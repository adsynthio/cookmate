description: A dry North Indian sabzi of potato cubes cooked with fresh fenugreek leaves, garlic and cumin. It is slightly
  bitter, garlicky and goes well with roti or paratha.
descriptions:
  hi: आलू के टुकड़ों और ताज़ी मेथी की पत्तियों से बनी सूखी उत्तर भारतीय सब्ज़ी, जिसमें लहसुन और जीरा पड़ता है। हल्की कड़वाहट
    और लहसुन के स्वाद वाली यह सब्ज़ी रोटी या पराठे के साथ अच्छी लगती है।
  hi-Latn: Aloo ke tukdon aur taazi methi ki pattiyon se bani sookhi North Indian sabzi, jismein lehsun aur jeera padta hai.
    Halki kadwahat aur lehsun ke swaad wali yeh sabzi roti ya parathe ke saath achhi lagti hai.
