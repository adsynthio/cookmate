steps:
- text: Dry roast the semolina in a kadai on low heat, stirring often, then tip it onto a plate.
  technique: dry_roast
  minutes: 6
  timer: true
  heat: low
  cues:
    look: The grains look dry, separate and just turn pale cream.
    smell: It smells lightly nutty.
  say:
    hi:
      text: कड़ाही में सूजी को धीमी आँच पर लगातार चलाते हुए सूखा भूनें, फिर प्लेट में निकाल लें।
      look: दाने सूखे, अलग-अलग और हल्के क्रीम रंग के दिखने लगें।
      smell: हल्की सौंधी खुशबू आने लगे।
    hi-Latn:
      text: Kadai me suji ko dheemi aanch par lagatar chalate hue sookha bhunein, phir plate me nikaal lein.
      look: Daane sookhe, alag-alag aur halke cream rang ke dikhne lagein.
      smell: Halki saundhi khushboo aane lage.
- text: Heat the oil on medium, add mustard seeds, then urad dal and chana dal, and fry till the dals turn golden; add curry
    leaves, green chilli and ginger.
  technique: tadka
  minutes: 2
  heat: medium
  cues:
    look: The dals turn golden brown.
    sound: The mustard seeds crackle and pop.
  safety: Curry leaves splutter in hot oil, so stand back as you add them.
  say:
    hi:
      text: मध्यम आँच पर तेल गरम करें, राई डालें, फिर उड़द दाल और चना दाल डालकर सुनहरा होने तक भूनें; फिर करी पत्ते, हरी मिर्च
