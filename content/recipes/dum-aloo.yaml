steps:
- text: Pressure-cook the washed potatoes with enough water to cover for 2 whistles, let the pressure drop on its own, then
    peel them.
  technique: pressure_cook
  whistles: 2
  heat: medium
  cues:
    touch: A knife should go in easily but the potato should still hold its shape.
  safety: Open the cooker only after the pressure has fully dropped.
  say:
    hi:
      text: धुले हुए आलू को डूबने लायक पानी के साथ कुकर में 2 सीटी तक पकाएँ, प्रेशर अपने आप उतरने दें, फिर छील लें।
      touch: चाकू आसानी से जाए पर आलू टूटे नहीं।
      safety: कुकर प्रेशर पूरी तरह उतरने के बाद ही खोलें।
    hi-Latn:
      text: Dhule hue aloo ko doobne laayak paani ke saath cooker mein 2 seeti tak pakayein, pressure apne aap utarne dein,
        phir chheel lein.
      touch: Chaaku aasaani se jaaye par aloo toote nahi.
      safety: Cooker pressure poori tarah utarne ke baad hi kholein.
- text: Prick each potato with a fork and fry them in the hot oil in a kadai, turning often, until golden in patches, then
    lift them out.
  technique: shallow_fry
  minutes: 6
  timer: true
  heat: medium
  cues:
    look: Golden-brown spots all over the potatoes.
  safety: Dry the potatoes well so the oil does not splutter.
  say:
    hi:
      text: हर आलू में काँटे से छेद करें और कड़ाही में गरम तेल में बार-बार पलटते हुए सुनहरा होने तक तलें, फिर निकाल लें।
      look: आलू पर चारों तरफ़ सुनहरे-भूरे धब्बे आ जाएँ।
      safety: आलू अच्छे से सुखा लें ताकि तेल न उछले।
    hi-Latn:
      text: Har aloo mein kaante se chhed karein aur kadai mein garam tel mein baar-baar palatte hue sunehra hone tak talein,
        phir nikaal lein.
      look: Aloo par chaaron taraf sunehre-bhure dhabbe aa jaayein.
      safety: Aloo achhe se sukha lein taaki tel na uchhle.
- text: In the same oil, add cumin seeds and bay leaf, then add the onion and fry until golden brown.
  technique: saute_onion
  minutes: 8
  timer: true
  heat: medium
  cues:
    look: Onions turn an even golden brown.
    sound: Cumin seeds crackle as soon as they hit the oil.
  say:
    hi:
      text: उसी तेल में जीरा और तेज पत्ता डालें, फिर प्याज़ डालकर सुनहरा भूरा होने तक भूनें।
      look: प्याज़ एक जैसे सुनहरे भूरे हो जाएँ।
      sound: तेल में डालते ही जीरा चटकने लगे।
    hi-Latn:
      text: Usi tel mein jeera aur tej patta daalein, phir pyaaz daalkar sunehra bhura hone tak bhoonein.
