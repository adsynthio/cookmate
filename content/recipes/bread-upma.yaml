steps:
- text: Cut the bread slices into small bite-size cubes; finely chop the onion, tomato, green chilli and ginger.
  minutes: 5
  timer: true
  say:
    hi:
      text: ब्रेड स्लाइस को छोटे-छोटे टुकड़ों में काट लें; प्याज़, टमाटर, हरी मिर्च और अदरक बारीक काट लें।
    hi-Latn:
      text: Bread slice ko chhote-chhote tukdon mein kaat lein; pyaaz, tamatar, hari mirch aur adrak bareek kaat lein.
- text: Heat the oil in a kadai, add mustard seeds, then urad dal, chana dal and curry leaves.
  technique: tadka
  minutes: 2
  heat: medium
  cues:
    look: The dals turn light golden.
    sound: The mustard seeds crackle and the curry leaves splutter.
  safety: Curry leaves splutter in hot oil, so stand back when adding them.
  say:
    hi:
      text: कड़ाही में तेल गरम करें, राई डालें, फिर उड़द दाल, चना दाल और करी पत्ते डालें।
      look: दालें हल्की सुनहरी हो जाएँ।
      sound: राई चटकने लगे और करी पत्ते छनछनाएँ।
      safety: गरम तेल में करी पत्ते छिटकते हैं, डालते समय थोड़ा पीछे रहें।
    hi-Latn:
      text: Kadai mein tel garam karein, rai daalein, phir urad dal, chana dal aur curry patte daalein.
      look: Dalein halki sunehri ho jaayein.
      sound: Rai chatakne lage aur curry patte chhanchhanaayein.
      safety: Garam tel mein curry patte chhitakte hain, daalte samay thoda peeche rahein.
- text: Add the onion, green chilli and ginger and sauté until the onion is soft.
  technique: saute_onion
  minutes: 4
  timer: true
  heat: medium
  cues:
    look: The onion turns soft and translucent.
    smell: The raw smell of ginger goes away.
  say:
    hi:
      text: प्याज़, हरी मिर्च और अदरक डालकर प्याज़ नरम होने तक भूनें।
      look: प्याज़ नरम और पारदर्शी हो जाए।
      smell: अदरक की कच्ची महक चली जाए।
    hi-Latn:
      text: Pyaaz, hari mirch aur adrak daalkar pyaaz naram hone tak bhunein.
      look: Pyaaz naram aur transparent ho jaaye.
      smell: Adrak ki kachchi mehak chali jaaye.
- text: Add the tomato, turmeric, red chilli powder, salt and sugar, and cook until the tomato turns mushy.
  technique: bhuna
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The tomato breaks down and oil shows at the edges.
  say:
    hi:
      text: टमाटर, हल्दी, लाल मिर्च पाउडर, नमक और चीनी डालकर टमाटर गलने तक पकाएँ।
      look: टमाटर गल जाए और किनारों पर तेल दिखने लगे।
    hi-Latn:
      text: Tamatar, haldi, lal mirch powder, namak aur cheeni daalkar tamatar galne tak pakaayein.
      look: Tamatar gal jaaye aur kinaron par tel dikhne lage.
- text: Sprinkle 2 to 3 tablespoons of water, add the bread cubes and toss gently until every piece is coated with masala.
  minutes: 3
