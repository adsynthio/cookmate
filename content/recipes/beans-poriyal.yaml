description: A South Indian dry stir-fry of finely chopped french beans. They are tempered with mustard seeds, urad dal and
  curry leaves and finished with fresh grated coconut. It goes with rice and sambar or rasam.
descriptions:
  hi: बारीक कटी फ्रेंच बीन्स की दक्षिण भारतीय सूखी सब्ज़ी। इसमें राई, उड़द दाल और करी पत्ते का तड़का लगता है और ऊपर से ताज़ा
    कसा नारियल डलता है। चावल के साथ सांभर या रसम के संग परोसें।
  hi-Latn: Baarik kati french beans ki South Indian sookhi sabzi. Isme rai, urad dal aur curry patte ka tadka lagta hai aur
    upar se taaza kasa nariyal padta hai. Chawal ke saath sambar ya rasam ke sang parosein.
