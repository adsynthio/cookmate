description: Rajasthani five-lentil dal, pressure-cooked soft and finished with a ghee tadka of cumin, cloves, hing and tomato.
  It goes well with bati, roti or rice.
descriptions:
  hi: राजस्थानी पाँच दालों वाली दाल। दालें प्रेशर कुकर में नरम पकाई जाती हैं, फिर ऊपर से घी में जीरा, लौंग, हींग और टमाटर
    का तड़का लगता है। बाटी, रोटी या चावल के साथ बढ़िया लगती है।
  hi-Latn: Rajasthani paanch daalon wali dal. Daalein pressure cooker mein naram pakayi jaati hain, phir upar se ghee mein
    jeera, laung, hing aur tamatar ka tadka lagta hai. Baati, roti ya chawal ke saath badhiya lagti hai.
