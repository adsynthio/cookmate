steps:
- text: Wash the masoor dal 3 to 4 times in water and soak it for 15 minutes.
  technique: soak
  minutes: 15
  timer: true
  cues:
    look: The washing water runs almost clear.
  say:
    hi:
      text: मसूर दाल को 3-4 बार पानी में धोकर 15 मिनट भिगो दें।
      look: धोने का पानी लगभग साफ़ निकलने लगे।
    hi-Latn:
      text: Masoor dal ko 3-4 baar paani mein dhokar 15 minute bhigo dein.
      look: Dhone ka paani lagbhag saaf nikalne lage.
- text: Drain the dal and put it in the pressure cooker with 700 ml water, the turmeric and the salt. Cook for 2 whistles
    on medium heat, then let the pressure drop on its own.
  technique: pressure_cook
  minutes: 10
  whistles: 2
  timer: true
  heat: medium
  safety: Open the lid only after all the pressure has gone.
  say:
    hi:
      text: दाल का पानी निकालकर उसे कुकर में डालें, साथ में 700 ml पानी, हल्दी और नमक डालें। मध्यम आँच पर 2 सीटी आने दें,
        फिर प्रेशर अपने आप उतरने दें।
      safety: ढक्कन तभी खोलें जब पूरा प्रेशर निकल जाए।
    hi-Latn:
      text: Dal ka paani nikaalkar use cooker mein daalein, saath mein 700 ml paani, haldi aur namak daalein. Medium aanch
        par 2 seeti aane dein, phir pressure apne aap utarne dein.
      safety: Dhakkan tabhi kholein jab poora pressure nikal jaaye.
- text: Open the cooker and whisk the dal with a ladle until it is smooth.
  cues:
    look: The dal is creamy and no whole grains are left.
  say:
    hi:
      text: कुकर खोलकर दाल को कलछी से घोंटकर एकसार कर लें।
      look: दाल मलाईदार हो जाए और कोई साबुत दाना न दिखे।
    hi-Latn:
      text: Cooker kholkar dal ko kalchhi se ghontkar eksaar kar lein.
      look: Dal malaidaar ho jaaye aur koi saabut daana na dikhe.
- text: Heat the ghee in a kadai on medium heat. Add the cumin seeds and asafoetida, then add the chopped garlic and green
    chilli.
  technique: tadka
  minutes: 1
  heat: medium
  cues:
    look: The garlic turns light golden.
    sound: The cumin crackles.
