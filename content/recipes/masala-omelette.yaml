description: A soft, fully cooked egg omelette loaded with chopped onion, tomato, green chilli and coriander, spiced with
  turmeric and red chilli. It is the everyday Indian breakfast omelette, eaten hot with bread or roti.
descriptions:
  hi: प्याज़, टमाटर, हरी मिर्च और हरे धनिये से भरा, हल्दी और लाल मिर्च वाला नरम और पूरा पका अंडे का ऑमलेट। यह रोज़ का देसी
    नाश्ता है, जिसे गरम-गरम ब्रेड या रोटी के साथ खाया जाता है।
  hi-Latn: Pyaaz, tamatar, hari mirch aur hare dhaniye se bhara, haldi aur laal mirch wala naram aur poora paka ande ka omelette.
    Yeh roz ka desi nashta hai, jise garam-garam bread ya roti ke saath khaya jaata hai.
