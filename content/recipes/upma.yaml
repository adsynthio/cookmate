    hi:
      text: प्याज़ डालें और नरम होने तक भूनें।
      look: प्याज़ नरम और पारदर्शी हो जाए, भूरा नहीं।
    hi-Latn:
      text: Pyaaz daalein aur naram hone tak bhunein.
      look: Pyaaz naram aur transparent ho jaye, bhoora nahi.
