steps:
- text: Wash the toor dal, add turmeric and 450 ml water, and pressure-cook for 3 whistles on medium heat, then mash it smooth.
  technique: pressure_cook
  minutes: 12
  whistles: 3
  timer: true
  heat: medium
  cues:
    look: The dal is soft and mashes into a smooth paste.
  safety: Let the pressure drop on its own before you open the cooker.
  say:
    hi:
      text: अरहर दाल धोकर उसमें हल्दी और 450 ml पानी डालें, मध्यम आँच पर 3 सीटी तक प्रेशर कुक करें, फिर दाल को अच्छी तरह मैश
        करें।
      look: दाल नरम हो जाती है और मैश करने पर चिकना पेस्ट बन जाती है।
      safety: कुकर खोलने से पहले प्रेशर अपने आप उतरने दें।
    hi-Latn:
      text: Arhar dal dho kar usme haldi aur 450 ml paani daalein, medium aanch par 3 seeti tak pressure cook karein, phir
        dal ko achhi tarah mash karein.
      look: Dal naram ho jaati hai aur mash karne par chikna paste ban jaati hai.
      safety: Cooker kholne se pehle pressure apne aap utarne dein.
- text: Soak the tamarind in 200 ml warm water for 10 minutes, then squeeze it well and strain out the juice.
  technique: soak
  minutes: 10
  timer: true
  cues:
    touch: The pulp feels soft and comes away from the fibres easily.
  say:
    hi:
      text: इमली को 200 ml गुनगुने पानी में 10 मिनट भिगोएँ, फिर अच्छे से मसलकर उसका रस छान लें।
      touch: गूदा नरम लगता है और रेशों से आसानी से अलग हो जाता है।
    hi-Latn:
      text: Imli ko 200 ml gunguney paani mein 10 minute bhigoyein, phir achhe se masal kar uska ras chhaan lein.
      touch: Gooda naram lagta hai aur reshon se aasani se alag ho jaata hai.
- text: Heat half the oil in a kadai, sauté the chopped onion until soft, then add the tomato and cook until mushy.
  technique: saute_onion
  minutes: 5
  timer: true
  heat: medium
  cues:
    look: The onion turns translucent and the tomato breaks down.
  say:
    hi:
      text: कड़ाही में आधा तेल गरम करें, कटा प्याज़ नरम होने तक भूनें, फिर टमाटर डालकर गलने तक पकाएँ।
      look: प्याज़ पारदर्शी हो जाता है और टमाटर गल जाता है।
    hi-Latn:
      text: Kadai mein aadha tel garam karein, kata pyaaz naram hone tak bhunein, phir tamatar daal kar galne tak pakayein.
      look: Pyaaz transparent ho jaata hai aur tamatar gal jaata hai.
- text: Add the drumstick pieces, brinjal, salt and tamarind water, then cover and cook until the vegetables are tender.
  technique: simmer
  minutes: 10
  timer: true
  heat: medium
  cues:
    touch: A knife goes easily through the drumstick and brinjal.
  say:
    hi:
      text: सहजन के टुकड़े, बैंगन, नमक और इमली का पानी डालें, फिर ढककर सब्ज़ियाँ नरम होने तक पकाएँ।
      touch: चाकू सहजन और बैंगन में आसानी से चला जाता है।
    hi-Latn:
      text: Sahjan ke tukde, baingan, namak aur imli ka paani daalein, phir dhak kar sabziyan naram hone tak pakayein.
      touch: Chaaku sahjan aur baingan mein aasani se chala jaata hai.
- text: Stir in the sambar powder, mashed dal, jaggery and about 400 ml water, then simmer until it thickens slightly.
  technique: simmer
  minutes: 8
  timer: true
  heat: low
  cues:
    look: The sambar is pourable but coats the back of a spoon.
    smell: The raw smell of the sambar powder goes away.
  say:
    hi:
      text: सांभर मसाला, मैश की हुई दाल, गुड़ और लगभग 400 ml पानी मिलाएँ, फिर हल्का गाढ़ा होने तक धीमी आँच पर उबालें।
      look: सांभर बहने लायक रहता है पर चम्मच के पीछे लिपट जाता है।
      smell: सांभर मसाले की कच्ची महक चली जाती है।
    hi-Latn:
      text: Sambar masala, mash ki hui dal, gud aur lagbhag 400 ml paani milayein, phir halka gaadha hone tak dheemi aanch
        par ubaalein.
      look: Sambar behne laayak rehta hai par chammach ke peeche lipat jaata hai.
      smell: Sambar masale ki kachchi mehak chali jaati hai.
- text: Heat the remaining oil in a small pan, crackle the mustard seeds, then add fenugreek seeds, dry red chillies, curry
