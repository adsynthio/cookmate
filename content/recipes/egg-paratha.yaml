steps:
- text: Mix the flour, salt and oil, add about 150 ml water little by little and knead a soft dough, then cover and rest it
    for 15 minutes.
  technique: knead
  minutes: 15
  timer: true
  cues:
    touch: The dough feels soft and smooth and does not stick to your fingers.
  say:
    hi:
      text: आटा, नमक और तेल मिलाएं, लगभग 150 मिली पानी थोड़ा-थोड़ा डालकर नरम आटा गूंध लें, फिर ढककर 15 मिनट रख दें।
      touch: आटा नरम और चिकना लगे और उंगलियों पर न चिपके।
    hi-Latn:
      text: Atta, namak aur tel milayein, lagbhag 150 ml paani thoda-thoda daalkar naram atta goondh lein, phir dhakkar 15
        minute rakh dein.
      touch: Atta naram aur chikna lage aur ungliyon par na chipke.
- text: Beat the eggs in a bowl with the onion, green chilli, coriander leaves, red chilli powder and salt until frothy.
  cues:
    look: The mixture looks evenly yellow and a little frothy on top.
  say:
    hi:
      text: एक कटोरे में अंडे, प्याज़, हरी मिर्च, हरा धनिया, लाल मिर्च पाउडर और नमक डालकर झागदार होने तक फेंट लें।
      look: मिश्रण एक जैसा पीला और ऊपर से थोड़ा झागदार दिखे।
    hi-Latn:
      text: Ek katori mein ande, pyaaz, hari mirch, hara dhaniya, laal mirch powder aur namak daalkar jhaagdaar hone tak phent
