description: Thick, soft South Indian pancakes made from fermented idli dosa batter and topped with onion, tomato, green chilli
  and coriander. They are cooked on a tawa until golden underneath and served hot with chutney or sambar.
descriptions:
  hi: इडली डोसा बैटर से बने मोटे, नरम दक्षिण भारतीय उत्तपम, जिन पर प्याज़, टमाटर, हरी मिर्च और हरा धनिया डाला जाता है। इन्हें
    तवे पर नीचे से सुनहरा होने तक सेंका जाता है और गरमागरम चटनी या सांबर के साथ परोसा जाता है।
  hi-Latn: Idli dosa batter se bane mote, naram South Indian uttapam, jin par pyaaz, tamatar, hari mirch aur hara dhaniya
    daala jaata hai. Inhe tawe par neeche se sunehra hone tak senka jaata hai aur garamagaram chutney ya sambar ke saath parosa
    jaata hai.
