description: Thin, smooth toor dal that is sweet, sour and gently spiced, with jaggery, kokum and a ghee tadka of mustard,
  cloves and curry leaves. Everyday Gujarati comfort with hot rice.
descriptions:
  hi: पतली, मुलायम तूर दाल जो हल्की मीठी, खट्टी और कम तीखी होती है। इसमें गुड़, कोकम और राई, लौंग व करी पत्ते का घी वाला तड़का
    पड़ता है। गरम चावल के साथ रोज़ का गुजराती आराम।
  hi-Latn: Patli, smooth toor dal jo halki meethi, khatti aur kam teekhi hoti hai. Isme gud, kokum aur rai, laung aur kadi
    patte ka ghee wala tadka padta hai. Garam chawal ke saath roz ka Gujarati aaram.
