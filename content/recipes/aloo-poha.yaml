      sound: Tel mein halki chatchat aawaaz aaye.
      safety: Garam tel chhitak sakta hai; chehra door rakhein.
- text: In the same oil add mustard seeds; once they splutter add cumin, curry leaves and slit green chillies.
  technique: tadka
  minutes: 1
